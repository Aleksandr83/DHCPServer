<!DOCTYPE html>
<html lang="ru" data-page="settings_export">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Export Settings — DHCPServer</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div id="header-placeholder"></div>

    <main class="container">
        <h1 data-i18n="settings_export.title">Export Settings</h1>

        <div class="card">
            <p data-i18n="settings_export.desc">Download a full backup of the device settings as a JSON file. Passwords are not included.</p>

            <button class="btn btn-primary" onclick="exportSettings()" data-i18n="settings_export.button">Download JSON</button>
            <p id="export-result"></p>
        </div>
    </main>

    <div id="footer-placeholder"></div>
    <script src="../js/app.js"></script>
    <script>
        async function exportSettings() {
            const resultEl = document.getElementById('export-result');
            resultEl.textContent = '...';
            let resp;
            try {
                resp = await apiFetch('/api/settings/export');
            } catch (e) {
                resultEl.textContent = tr('settings_export.empty');
                return;
            }
            const text = await resp.text();
            let data = null;
            try { data = JSON.parse(text); } catch (e) { /* keep null */ }
            if (!resp.ok || !data || data.format !== 'dhcpserver-settings') {
                resultEl.textContent = tr('settings_export.empty');
                return;
            }

            const ver = data.firmware_version || 'unknown';
            const blob = new Blob([text], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'dhcpserver_settings_' + ver + '.conf';
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);

            resultEl.textContent = tr('settings_export.saved_as') + ': dhcpserver_settings_' + ver + '.conf';
        }
    </script>
</body>
</html>
