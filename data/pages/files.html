                    '&path=' + encodeURIComponent(dir));
                if (!resp.ok) return null;
                const data = await resp.json();
                return data.entries || [];
            } catch (e) {
                return null;
            }
        }

        async function uploadFolder(fileList) {
            const files = Array.from(fileList || []);
            if (files.length === 0) return;

            // `webkitRelativePath` reads "<picked folder>/<sub>/<file>", so the
            // picked folder itself becomes a directory in the current one — the
            // same thing every file manager does.
            const items = [];
            const dirs = new Set();
            for (const f of files) {
                const parts = (f.webkitRelativePath || f.name).split('/').filter(s => s.length);
                if (parts.length === 0) continue;
                const name = parts.pop();
                // Every level has to be created, not just the folder the file
                // sits in: a folder holding nothing but subfolders has no file
                // of its own, so it would never appear in this set — and the
                // first mkdir below it would then fail with "no such file or
                // directory" (the parent genuinely does not exist yet).
                for (let i = 1; i <= parts.length; i++) {
                    dirs.add(filesJoin(filesState.path, parts.slice(0, i).join('/')));
                }
                const rel = parts.join('/');
                const dir = rel ? filesJoin(filesState.path, rel) : filesState.path;
                dirs.add(dir);
                items.push({ file: f, dir: dir, name: name });
            }
            if (items.length === 0) return;

            uploadBegin();

            const depth = (p) => p.split('/').filter(s => s.length).length;
            const ordered = Array.from(dirs)
                .sort((a, b) => depth(a) - depth(b) || a.localeCompare(b));

            const existing = new Map();
            for (const dir of ordered) {
                const resp = await apiFetch('/api/files/mkdir', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ volume: filesState.volume, path: dir }),
                });
                // 409 = the directory is already there, which is the normal case
                // when the same folder is uploaded twice; anything else is real.
                if (!resp.ok && resp.status !== 409) {
                    filesStatus(tr('files.upload_folder_fail') + ': ' +
                                await filesError(resp), 'fail');
                    uploadEnd();
                    return;
                }
                // Listed AFTER the mkdir: for a fresh directory the listing is
                // empty (nothing to clash with), for an existing one it is the
                // set of names the overwrite question is about — and asking a
                // missing directory for its contents would only log a 404.
                existing.set(dir, await folderExistingNames(dir));
            }

            const clashes = items
                .filter(it => existing.get(it.dir).has(it.name.toLowerCase())).length;
            let done = 0, overwriteAll = false, stopped = false, cancelled = false, firstError = '';

            // One batch counter for the whole upload: the bar then moves steadily
            // across the folder instead of jumping 0→100 % per file.
            const batch = { done: 0, total: items.reduce((n, it) => n + it.file.size, 0) };

            for (let i = 0; i < items.length; i++) {
                const it = items[i];

                // Asked once per clash: "Overwrite" answers for this file,
                // "Overwrite all" for this and every remaining one, Cancel stops
                // the whole upload (what has already arrived stays).
                if (!overwriteAll && existing.get(it.dir).has(it.name.toLowerCase())) {
                    const choice = await filesModalOpen({
                        title: tr('files.overwrite_title') + ' (' + clashes + ')',
                        hint: filesJoin(it.dir, it.name) + '   ·   ' + tr('files.overwrite_note'),
                        okLabel: tr('files.overwrite'),
                        extraLabel: tr('files.overwrite_all'),
                    });
                    if (!choice) { stopped = true; break; }
                    if (choice === 'extra') overwriteAll = true;
                }

                const label = tr('files.uploading') + ' ' + (i + 1) + ' / ' + items.length +
                              ': ' + it.name;
                const err = await uploadOne(it.file, filesJoin(it.dir, it.name), label, batch);
                // Cancel pressed while this file was in flight: the rest of the
                // batch is dropped, what has already arrived stays. Only a file
                // that really arrived counts — a cancelled one reports null.
                if (err === '') done++;
                if (uploadCtl.cancelled) { cancelled = true; break; }
                if (err) {
                    if (!firstError) firstError = it.name + ': ' + err;
                }
            }

            document.getElementById('files-progress-row').style.display = 'none';
            uploadEnd();

            let summary = tr('files.upload_folder_done') + ' ' + done + ' / ' + items.length;
            if (cancelled) summary += '   ·   ' + tr('files.cancelled');
            if (stopped) summary += '   ·   ' + tr('files.stopped');
            if (firstError) summary += '   ·   ' + tr('files.fail') + ': ' + firstError;
            // A cancel is an operator action, not a failure: no red line (and the
            // text stays on screen, since a neutral message is not timed out).
            filesStatus(summary, (firstError || stopped) ? 'fail'
                                   : cancelled ? undefined : 'ok');
            await reloadFiles();
        }

        /* Download through fetch + object URL so the Basic-auth header is
           applied (a plain link would lose it and re-prompt). */
        async function downloadEntry(name) {
            const url = '/api/files/download?volume=' + encodeURIComponent(filesState.volume) +
                        '&path=' + encodeURIComponent(filesJoin(filesState.path, name));
            const resp = await apiFetch(url);
            if (!resp.ok) {
                filesStatus(tr('files.download_fail') + ': ' + await filesError(resp), 'fail');
                return;
            }
            const blob = await resp.blob();
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = name;
            document.body.appendChild(a);
            a.click();
            URL.revokeObjectURL(a.href);
            a.remove();
        }

        async function renameEntry(name) {
            const to = await filesModalOpen({
                title: tr('files.rename'),
                withInput: true,
                value: name,
                okLabel: tr('files.rename'),
            });
            if (!to || to === name) return;

            const resp = await apiFetch('/api/files/rename', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ volume: filesState.volume,
                                       path: filesJoin(filesState.path, name),
                                       to: filesJoin(filesState.path, to) }),
            });
            if (!resp.ok) {
                filesStatus(tr('files.fail') + ': ' + await filesError(resp), 'fail');
                return;
            }
            filesStatus(tr('files.ok'), 'ok');
            loadList();
        }

        async function deleteEntry(name, isDir) {
            const target = filesJoin(filesState.path, name);
            const confirmed = await filesModalOpen({
                title: tr('files.delete_confirm') + ' "' + name + '"?',
                danger: true,
                okLabel: tr('files.delete'),
            });
            if (!confirmed) return;

            const doDelete = async (recursive) => {
                return apiFetch('/api/files/delete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ volume: filesState.volume, path: target,
                                           recursive: recursive }),
                });
            };

            let resp = await doDelete(false);
            if (resp.status === 409 && isDir) {
                // The server refuses a non-empty directory: ask again, this
                // time spelling out that the contents go with it.
                const again = await filesModalOpen({
                    title: tr('files.delete_recursive_confirm'),
                    danger: true,
                    okLabel: tr('files.delete'),
                });
                if (!again) return;
                resp = await doDelete(true);
            }
            if (!resp.ok) {
                filesStatus(tr('files.fail') + ': ' + await filesError(resp), 'fail');
                return;
            }
            filesStatus(tr('files.ok'), 'ok');
            loadList();
        }

        async function formatVolume() {
            const first = await filesModalOpen({
                title: tr('files.format'),
                hint: tr('files.format_confirm1'),
                danger: true,
                okLabel: tr('files.ok_continue'),
            });
            if (!first) return;
            const second = await filesModalOpen({
                title: tr('files.format'),
                hint: tr('files.format_confirm2'),
                danger: true,
                okLabel: tr('files.format'),
            });
            if (!second) return;

            const resp = await apiFetch('/api/files/format', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ volume: filesState.volume, confirm: true }),
            });
            if (!resp.ok) {
                filesStatus(tr('files.format_fail') + ': ' + await filesError(resp), 'fail');
                return;
            }
            filesStatus(tr('files.format_ok'), 'ok');
            reloadFiles();
        }

        /* ─── Text editor ────────────────────────────────── */
        async function openEditor(name) {
            const path = filesJoin(filesState.path, name);
            const url = '/api/files/text?volume=' + encodeURIComponent(filesState.volume) +
                        '&path=' + encodeURIComponent(path);
            const resp = await apiFetch(url);
            if (!resp.ok) {
                filesStatus(tr('files.edit_fail') + ': ' + await filesError(resp), 'fail');
                return;
            }
            const data = await resp.json();
            filesState.editorPath = data.path || path;
            filesState.editorMtime = data.mtime || 0;
            document.getElementById('files-editor-path').textContent = filesState.editorPath;
            document.getElementById('files-editor-text').value = data.text || '';
            document.getElementById('files-editor-status').textContent = '';
            document.getElementById('files-editor-card').style.display = '';
            document.getElementById('files-editor-card').scrollIntoView({ behavior: 'smooth' });
        }

        function closeEditor() {
            document.getElementById('files-editor-card').style.display = 'none';
            filesState.editorPath = '';
            filesState.editorMtime = -1;
        }

        async function saveEditor() {
            const text = document.getElementById('files-editor-text').value;
            const statusEl = document.getElementById('files-editor-status');

            // `text` MUST be the last member: the firmware reads volume/path/mtime
            // from the part of the body that precedes it.
            const body = JSON.stringify({
                volume: filesState.volume,
                path: filesState.editorPath,
                mtime: filesState.editorMtime,
                text: text,
            });

            const resp = await apiFetch('/api/files/text', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: body,
            });
            if (!resp.ok) {
                statusEl.className = 'test-conn-result test-conn-fail';
                statusEl.textContent = tr('files.editor_fail') + ': ' + await filesError(resp);
                return;
            }
            const data = await resp.json();
            filesState.editorMtime = data.mtime || 0;
            statusEl.className = 'test-conn-result test-conn-ok';
            statusEl.textContent = tr('files.editor_saved');
            loadList();
        }

        /* ─── Bootstrap ──────────────────────────────────── */
        initToolbarMenu();

        document.addEventListener('DOMContentLoaded', async () => {
            updateActionsTitle();
            updateUploadTitles();
            await loadVolumes();
            await loadList();
            await loadFilesSettings();
        });

        /* The tab labels, table rows and breadcrumbs are built by JS, so a
           language switch must re-render them — app.js fires `i18n-applied`
           after the dictionary is loaded. The toolbar labels are `data-i18n`
           (translated by app.js itself), but its tooltip is an attribute and
           has to be set here. */
        document.addEventListener('i18n-applied', () => {
            updateActionsTitle();
            updateUploadTitles();
            if (filesState.volumes.length === 0) return;   // nothing loaded yet
            renderVolumeTabs();
            renderVolumeInfo();
            renderBreadcrumbs();
            renderRows(filesState.entries);
            loadFilesSettings();
        });
    </script>
</body>
</html>
