<!DOCTYPE html>
<html lang="ru" data-page="files">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Files — DHCPServer</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div id="header-placeholder"></div>

    <main class="container">
        <h1 data-i18n="files.title">Files</h1>

        <!-- Access policy (LAN-only by default) -->
        <div class="card toggle-row">
            <span data-i18n="files.allow_own_subnet">Allow only own subnet</span>
            <label class="toggle-switch">
                <input type="checkbox" id="files-allow-own-subnet" onchange="toggleAllowOwnSubnet()">
                <span class="toggle-slider"></span>
            </label>
        </div>
        <p class="hint" id="files-subnet-hint"></p>

        <!-- Volumes -->
        <div class="card">
            <div class="files-tabs" id="files-tabs"></div>
            <p class="hint" id="files-volume-info"></p>
        </div>

        <!-- Toolbar + breadcrumbs -->
        <div class="card">
            <!-- All global actions live behind one "⋯" button on the right: the
                 page is a listing, and the actions (create, upload, format) are
                 used rarely — they should not push the listing down. The menu
                 reuses the row-action styles (position: fixed, placed from the
                 button's rect), and its labels are `data-i18n`, so a language
                 switch needs no rebuild — only the JS-set tooltip is refreshed. -->
            <div class="test-conn-row files-toolbar">
                <div class="files-menu-wrap">
                    <button class="files-menu-btn" type="button" id="files-actions-btn"
                            title="Actions" aria-label="Actions">⋯</button>
                    <div class="files-menu files-toolbar-menu" id="files-actions-menu">
                        <button type="button" id="files-menu-new-file"
                                data-i18n="files.new_file">New file</button>
                        <button type="button" id="files-menu-new-folder"
                                data-i18n="files.new_folder">New folder</button>
                        <!-- The label toggles to "Clear selection" once every row
                             is ticked, so it is set by JS and carries no
                             `data-i18n` (applyTranslations would overwrite it). -->
                        <button type="button" id="files-menu-select-all">Select all</button>
                        <div class="files-menu-sep"></div>
                        <button type="button" id="files-menu-upload-file"
                                data-i18n="files.upload">Upload file</button>
                        <button type="button" id="files-menu-upload-folder"
                                data-i18n="files.upload_folder">Upload folder</button>
                        <div class="files-menu-sep"></div>
                        <!-- Bulk actions: they need a selection, so they stay
                             disabled (not hidden) until something is ticked. -->
                        <button type="button" id="files-menu-move"
                                data-i18n="files.move">Move to ...</button>
                        <button type="button" id="files-menu-copy"
                                data-i18n="files.copy">Copy to ...</button>
                        <button type="button" id="files-menu-delete-selected" class="danger"
                                data-i18n="files.delete">Delete</button>
                        <div class="files-menu-sep"></div>
                        <button type="button" id="files-menu-refresh"
                                data-i18n="files.refresh">Refresh</button>
                        <div class="files-menu-sep"></div>
                        <button type="button" id="files-menu-format" class="danger"
                                data-i18n="files.format">Format card</button>
                        <button type="button" id="files-menu-check"
                                data-i18n="files.check">Check for errors</button>
                    </div>
                </div>
                <input type="file" id="files-upload-input" style="display:none"
                       onchange="uploadFile(this.files[0])">
                <!-- `webkitdirectory` gives every file of the picked folder with
                     its relative path, which is what lets the tree be rebuilt. -->
                <input type="file" id="files-folder-input" webkitdirectory multiple
                       style="display:none" onchange="uploadFolder(this.files)">
            </div>

            <div id="files-progress-row" style="display:none; margin-top:0.6rem;">
                <div class="files-progress-head">
                    <span id="files-progress-label"></span>
                    <span class="files-progress-actions">
                        <!-- Icon-only on purpose: the row already carries the file name
                             and the percentage, so text would crowd it out. The title
                             and aria-label are set from the dictionary by the upload
                             code, because the button changes meaning (pause/resume). -->
                        <button type="button" class="files-icon-btn" id="files-pause-btn"
                                onclick="toggleUploadPause()">
                            <svg class="icon-pause" viewBox="0 0 16 16" aria-hidden="true"
                                 fill="currentColor">
                                <rect x="4" y="3" width="3" height="10" rx="1"></rect>
                                <rect x="9" y="3" width="3" height="10" rx="1"></rect>
                            </svg>
                            <svg class="icon-play" viewBox="0 0 16 16" aria-hidden="true"
                                 fill="currentColor">
                                <path d="M5 3.4 12.4 8 5 12.6Z"></path>
                            </svg>
                        </button>
                        <button type="button" class="files-icon-btn" id="files-cancel-btn"
                                onclick="cancelUpload()">
                            <svg viewBox="0 0 16 16" aria-hidden="true" fill="none"
                                 stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                                <path d="M4.2 4.2 11.8 11.8M11.8 4.2 4.2 11.8"></path>
                            </svg>
                        </button>
                    </span>
                    <span id="files-progress-percent"></span>
                </div>
                <div class="meter-track" style="height:8px;">
                    <div class="meter-fill ic-fill" id="files-progress-bar" style="width:0%;"></div>
                </div>
            </div>

            <nav class="files-breadcrumbs" id="files-breadcrumbs"></nav>
            <p class="test-conn-result" id="files-status"></p>
        </div>

        <!-- Listing -->
        <div class="card">
            <div class="table-wrap">
                <table id="files-table">
                    <thead>
                        <tr>
                            <!-- Selection column: narrow and caption-less, the
                                 checkbox carries its own meaning. -->
                            <th class="col-select"></th>
                            <th data-i18n="files.col_name">Name</th>
                            <!-- No header text for the action column: the "⋯"
                                 button carries the tooltip/aria-label. -->
                            <th class="col-actions"></th>
                            <th class="col-size" data-i18n="files.col_size">Size</th>
                            <th class="col-date" data-i18n="files.col_date">Modified</th>
                        </tr>
                    </thead>
                    <tbody id="files-tbody"></tbody>
                </table>
            </div>
            <p class="hint" id="files-empty" style="display:none;" data-i18n="files.empty">The folder is empty.</p>
        </div>

        <!-- Text editor -->
        <div class="card" id="files-editor-card" style="display:none;">
            <div class="toggle-row" style="margin-bottom:0.5rem;">
                <span id="files-editor-path"></span>
                <button class="btn" onclick="closeEditor()" data-i18n="files.editor_close">Close</button>
            </div>
            <textarea id="files-editor-text" class="files-editor" spellcheck="false" rows="18"></textarea>
            <div class="test-conn-row" style="margin-top:0.6rem;">
                <button class="btn btn-primary" onclick="saveEditor()" data-i18n="files.editor_save">Save</button>
                <span class="test-conn-result" id="files-editor-status"></span>
            </div>
        </div>
    </main>

    <!-- The dialog the explorer asks its questions in is shared with the rest of
         the UI (see `showDialog` in js/app.js): it used to be defined here, and
         the Internal Cache and Version pages asked theirs with the browser's
         own confirm() because of it. -->

    <!-- Destination picker of "Move ...": folders are entered by clicking them,
         the confirmation is the "Move here" button. Folders that are part of
         the selection are not offered at all — that is what makes "a folder into
         itself" impossible to pick instead of something to be refused later. -->
    <div class="modal-backdrop" id="files-picker" style="display:none;">
        <div class="modal-card" role="dialog" aria-modal="true">
            <h3 id="files-picker-title">Move to</h3>
            <!-- The destination volume is part of the choice: the whole point of a
                 transfer is that source and destination need not be one volume.
                 Only mounted ones are offered (the buttons are built by JS). -->
            <div class="files-picker-volumes" id="files-picker-volumes"></div>
            <p class="hint" id="files-picker-hint"></p>
            <div class="files-picker-path" id="files-picker-path"></div>
            <div class="files-picker-list" id="files-picker-list"></div>
            <div class="modal-actions">
                <button class="btn" id="files-picker-cancel" data-i18n="files.cancel">Cancel</button>
                <!-- Label and meaning follow the operation (move / copy), so JS sets
                     it — a script-written label must not keep `data-i18n`, or
                     applyTranslations() would overwrite it on a language switch. -->
                <button class="btn btn-primary" id="files-picker-ok">Move here</button>
            </div>
        </div>
    </div>

    <!-- Volume check ("Check for errors"): the walk runs on the device, so this
         dialog polls it and stays cancellable while it works. Its lower row of
         buttons only appears once something was found — FatFs cannot repair
         anything, so the only honest offers are "delete the unreadable entries"
         and "format the card". -->
    <div class="modal-backdrop" id="files-check" style="display:none;">
        <div class="modal-card" role="dialog" aria-modal="true">
            <h3 data-i18n="files.check">Check for errors</h3>
            <p class="hint" id="files-check-state"></p>
            <div class="files-picker-path" id="files-check-current"></div>
            <div class="files-picker-list" id="files-check-errors"></div>
            <div class="modal-actions">
                <!-- Label and action depend on the state: cancel while it runs,
                     close once it is through — set by JS, no `data-i18n`. -->
                <button class="btn" id="files-check-close">Close</button>
                <button class="btn" id="files-check-delete" style="display:none;"
                        data-i18n="files.repair_delete">Delete damaged</button>
                <button class="btn btn-danger" id="files-check-format" style="display:none;"
                        data-i18n="files.format">Format card</button>
            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>
    <script src="../js/app.js"></script>
    <script>
        /* ─── State ─────────────────────────────────────── */
        const filesState = {
            volume: 'fat',
            path: '/',
            volumes: [],
            current: null,
            entries: [],
            // Names ticked in the CURRENT directory (bulk move/delete act on
            // them). Cleared whenever the listing shows another directory.
            selected: new Set(),
            listKey: '',
            // mtime of the file currently open in the editor (conflict token)
            editorMtime: -1,
            editorPath: '',
        };

        /* ─── Path helpers ──────────────────────────────── */
        function filesJoin(dir, name) {
            if (!dir || dir === '/') return '/' + name;
            return dir.replace(/\/+$/, '') + '/' + name;
        }

        function filesParent(path) {
            if (!path || path === '/') return '/';
            const i = path.lastIndexOf('/');
            return i <= 0 ? '/' : path.substring(0, i);
        }

        /* ─── Formatting ────────────────────────────────── */
        function filesFmtSize(bytes) {
            if (bytes === undefined || bytes === null) return '';
            if (bytes < 1024) return bytes + ' B';
            const kb = bytes / 1024;
            if (kb < 1024) return kb.toFixed(kb < 10 ? 1 : 0) + ' KB';
            const mb = kb / 1024;
            if (mb < 1024) return mb.toFixed(mb < 10 ? 1 : 0) + ' MB';
            return (mb / 1024).toFixed(2) + ' GB';
        }

        function filesFmtDate(unixSec) {
            if (!unixSec) return '—';
            const d = new Date(unixSec * 1000);
            if (isNaN(d.getTime()) || d.getFullYear() < 2000) return '—';
            const p = (n) => String(n).padStart(2, '0');
            return p(d.getDate()) + '-' + p(d.getMonth() + 1) + '-' + d.getFullYear() +
                   ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
        }

        /* Success messages clear themselves (the next listing refresh would
           otherwise leave a stale line); errors stay until something replaces
           them, so the operator can read them. */
        let filesStatusTimer = null;
        function filesStatus(text, kind) {
            const el = document.getElementById('files-status');
            el.textContent = text || '';
            el.className = 'test-conn-result' +
                (kind === 'ok' ? ' test-conn-ok' : kind === 'fail' ? ' test-conn-fail' : '');

            if (filesStatusTimer) {
                clearTimeout(filesStatusTimer);
                filesStatusTimer = null;
            }
            if (text && kind === 'ok') {
                filesStatusTimer = setTimeout(() => { el.textContent = ''; }, 3000);
            }
        }

        /* Server error bodies carry a stable English `message`; show it plus the
           optional technical detail, so nothing is hidden from the operator. */
        async function filesError(resp) {
            let msg = 'HTTP ' + resp.status;
            try {
                const j = await resp.json();
                if (j && j.message) msg = j.message;
                if (j && j.detail) msg += ' (' + j.detail + ')';
            } catch (e) { /* not JSON */ }
            return msg;
        }

        /* ─── Settings (LAN-only policy) ─────────────────── */
        /* The subnet itself (address/mask) is not repeated here — it belongs to
           the DHCP page. The line only appears when there is something to warn
           about: a filter that cannot be applied, or refused requests. */
        async function loadFilesSettings() {
            try {
                const s = await fetchJSON('/api/files/settings');
                document.getElementById('files-allow-own-subnet').checked = !!s.allow_own_subnet;

                let hint = '';
                if (s.allow_own_subnet && !s.filter_active) {
                    hint = tr('files.filter_skipped');
                }
                if (s.blocked_count > 0) {
                    hint += (hint ? '   ·   ' : '') +
                            tr('files.blocked') + ' ' + s.blocked_count;
                }

                const hintEl = document.getElementById('files-subnet-hint');
                hintEl.textContent = hint;
                hintEl.style.display = hint ? '' : 'none';
            } catch (e) {
                console.warn('files settings failed:', e);
            }
        }

        async function toggleAllowOwnSubnet() {
            const cb = document.getElementById('files-allow-own-subnet');
            const wanted = cb.checked;
            try {
                const resp = await apiFetch('/api/files/settings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ allow_own_subnet: wanted }),
                });
                if (!resp.ok) {
                    cb.checked = !wanted;
                    filesStatus(tr('files.save_fail') + ': ' + await filesError(resp), 'fail');
                    return;
                }
                filesStatus(tr('files.saved'), 'ok');
                loadFilesSettings();
            } catch (e) {
                cb.checked = !wanted;
                filesStatus(tr('files.save_fail') + ': ' + e, 'fail');
            }
        }

        /* ─── Volumes ────────────────────────────────────── */
        async function loadVolumes() {
            let data;
            try {
                data = await fetchJSON('/api/files/volumes');
            } catch (e) {
                document.getElementById('files-tabs').innerHTML = '';
                document.getElementById('files-volume-info').textContent =
                    tr('files.load_fail') + ': ' + e;
                return [];
            }

            filesState.volumes = data.volumes || [];

            // Keep the current volume if it still exists, else take the first
            // mounted one (the card may not be inserted at all).
            let current = filesState.volumes.find(v => v.id === filesState.volume);
            if (!current || !current.mounted) {
                const firstMounted = filesState.volumes.find(v => v.mounted);
                current = firstMounted || current || filesState.volumes[0];
            }
            if (!current) {
                document.getElementById('files-tabs').innerHTML = '';
                document.getElementById('files-volume-info').textContent = tr('files.no_volumes');
                document.getElementById('files-tbody').innerHTML = '';
                return [];
            }
            filesState.volume = current.id;
            filesState.current = current;
            renderVolumeTabs();
            renderVolumeInfo();

            return filesState.volumes;
        }

        /* Volume tabs and the capacity line are generated text, so they are
           rendered by their own functions — the language switch re-runs them
           (see the `i18n-applied` listener below) instead of leaving stale
           labels on screen. */
        function renderVolumeTabs() {
            const tabs = document.getElementById('files-tabs');
            tabs.innerHTML = '';

            filesState.volumes.forEach(v => {
                const b = document.createElement('button');
                b.className = 'files-tab' + (v.id === filesState.volume ? ' active' : '');
                const label = tr(v.id === 'fat' ? 'files.volume_fat' : 'files.volume_sd');
                b.textContent = v.mounted ? label : label + ' (' + tr('files.not_inserted') + ')';
                b.disabled = !v.mounted;
                b.onclick = () => {
                    filesState.volume = v.id;
                    filesState.path = '/';
                    closeEditor();
                    loadVolumes().then(loadList);
                };
                tabs.appendChild(b);
            });

            // Which actions make sense for the current volume (formatting is
            // offered for the card only, everything that writes needs a mount).
            updateToolbarState();
        }

        function renderVolumeInfo() {
            const info = document.getElementById('files-volume-info');
            const current = filesState.current;
            if (!current) {
                info.textContent = tr('files.no_volumes');
                return;
            }
            if (current.mounted) {
                info.textContent = current.mount_point + '   ·   ' +
                    tr('files.free_of') + ' ' + filesFmtSize(current.free_bytes) +
                    ' / ' + filesFmtSize(current.total_bytes);
            } else {
                info.textContent = tr('files.not_inserted') +
                    (current.error ? ' — ' + current.error : '');
            }
        }

        /* ─── Listing ────────────────────────────────────── */
        function renderBreadcrumbs() {
            const nav = document.getElementById('files-breadcrumbs');
            nav.innerHTML = '';

            const root = document.createElement('a');
            root.href = '#';
            root.textContent = tr('files.root');
            root.onclick = (e) => { e.preventDefault(); filesState.path = '/'; loadList(); };
            nav.appendChild(root);

            const parts = filesState.path.split('/').filter(p => p.length > 0);
            let acc = '';
            parts.forEach((part, i) => {
                acc += '/' + part;
                const sep = document.createElement('span');
                sep.textContent = ' / ';
                nav.appendChild(sep);

                const a = document.createElement('a');
                a.href = '#';
                a.textContent = part;
                const target = acc;
                a.onclick = (e) => {
                    e.preventDefault();
                    filesState.path = i === parts.length - 1 ? filesState.path : target;
                    loadList();
                };
                nav.appendChild(a);
            });
        }

        function renderRows(entries) {
            filesState.entries = entries || [];
            const tbody = document.getElementById('files-tbody');
            tbody.innerHTML = '';

            // ".." row — always there except at the volume root.
            if (filesState.path !== '/') {
                const tr_ = document.createElement('tr');
                tr_.innerHTML = '<td class="col-select"></td>' +
                                '<td><a href="#" class="files-up">⬆ ' + tr('files.up') +
                                '</a></td><td class="col-actions"></td>' +
                                '<td class="col-size"></td><td class="col-date"></td>';
                tr_.querySelector('a').onclick = (e) => {
                    e.preventDefault();
                    filesState.path = filesParent(filesState.path);
                    loadList();
                };
                tbody.appendChild(tr_);
            }

            entries.forEach(e => {
                const row = document.createElement('tr');
                row.dataset.name = e.name;
                if (filesState.selected.has(e.name)) row.classList.add('files-row-selected');

                // 0. Selection checkbox
                const selCell = document.createElement('td');
                selCell.className = 'col-select';
                const cb = document.createElement('input');
                cb.type = 'checkbox';
                cb.checked = filesState.selected.has(e.name);
                cb.title = tr('files.select');
                cb.setAttribute('aria-label', tr('files.select'));
                cb.onclick = (ev) => ev.stopPropagation();
                cb.onchange = () => setSelected(e.name, cb.checked);
                selCell.appendChild(cb);
                row.appendChild(selCell);

                // 1. Name
                const nameCell = document.createElement('td');
                if (e.is_dir) {
                    const a = document.createElement('a');
                    a.href = '#';
                    a.textContent = '📁 ' + e.name;
                    a.onclick = (ev) => {
                        ev.preventDefault();
                        filesState.path = filesJoin(filesState.path, e.name);
                        loadList();
                    };
                    nameCell.appendChild(a);
                } else {
                    nameCell.textContent = '📄 ' + e.name;
                }
                row.appendChild(nameCell);

                // 2. Actions — one "⋯" button that opens the menu
                const actions = document.createElement('td');
                actions.className = 'col-actions';

                const menuBtn = document.createElement('button');
                menuBtn.className = 'files-menu-btn';
                menuBtn.type = 'button';
                menuBtn.title = tr('files.col_actions');
                menuBtn.setAttribute('aria-label', tr('files.col_actions'));
                menuBtn.textContent = '⋯';
                menuBtn.onclick = (ev) => {
                    ev.stopPropagation();
                    toggleRowMenu(menuBtn);
                };
                actions.appendChild(menuBtn);

                // Action menu; its items are built here so the row knows its
                // own entry (files get Download/Open, directories only the
                // structural actions).
                const menu = document.createElement('div');
                menu.className = 'files-menu';

                const addItem = (label, danger, handler) => {
                    const b = document.createElement('button');
                    b.type = 'button';
                    b.textContent = label;
                    if (danger) b.className = 'danger';
                    b.onclick = (ev) => {
                        ev.stopPropagation();
                        closeRowMenus();
                        handler();
                    };
                    menu.appendChild(b);
                };

                if (!e.is_dir) {
                    addItem(tr('files.download'), false, () => downloadEntry(e.name));
                    addItem(tr('files.edit'), false, () => openEditor(e.name));
                }
                addItem(tr('files.rename'), false, () => renameEntry(e.name));
                addItem(tr('files.delete'), true, () => deleteEntry(e.name, e.is_dir));

                actions.appendChild(menu);
                row.appendChild(actions);

                // 3. Size (files only — a directory has no size to show)
                const sizeCell = document.createElement('td');
                sizeCell.className = 'col-size';
                sizeCell.textContent = e.is_dir ? '' : filesFmtSize(e.size);
                row.appendChild(sizeCell);

                // 4. Modification date
                const dateCell = document.createElement('td');
                dateCell.className = 'col-date';
                dateCell.textContent = filesFmtDate(e.mtime);
                row.appendChild(dateCell);

                // The rest of the row selects as well — one click on the row, the
                // way a file manager behaves. The exceptions are the things that
                // already mean something: the name link, the "⋯" button and the
                // action menu it opens.
                row.onclick = (ev) => {
                    if (ev.target.closest('a') || ev.target.closest('button') ||
                        ev.target.closest('.files-menu') || ev.target === cb) return;
                    cb.checked = !cb.checked;
                    setSelected(e.name, cb.checked);
                };

                tbody.appendChild(row);
            });

            document.getElementById('files-empty').style.display =
                entries.length === 0 ? '' : 'none';

            // The listing is what the menu's item states depend on (select all,
            // move/delete of a selection), so they are refreshed here — every
            // re-render goes through this function.
            updateToolbarState();
        }

        /* ─── Row action menu ───────────────────────────── */
        /* Placed from the button's bounding rect with `position: fixed`: the
           listing scrolls horizontally, so a menu positioned inside the table
           would be clipped. It is flipped upwards when it would run past the
           bottom of the viewport, and any scroll/resize closes it. */
        function closeRowMenus() {
            document.querySelectorAll('.files-menu.open')
                .forEach(m => m.classList.remove('open'));
        }

        function toggleRowMenu(btn) {
            const menu = btn.parentElement.querySelector('.files-menu');
            if (!menu) return;

            const wasOpen = menu.classList.contains('open');
            closeRowMenus();
            if (wasOpen) return;

            menu.classList.add('open');

            const r = btn.getBoundingClientRect();
            const menuRect = menu.getBoundingClientRect();
            let top = r.bottom + 4;
            if (top + menuRect.height > window.innerHeight - 8) {
                top = Math.max(8, r.top - menuRect.height - 4);
            }
            let left = r.right - menuRect.width;
            if (left < 8) left = 8;

            menu.style.top = top + 'px';
            menu.style.left = left + 'px';
        }

        // Clicking anywhere else (or scrolling/resizing) closes the menu.
        document.addEventListener('click', () => closeRowMenus());
        window.addEventListener('scroll', () => closeRowMenus(), true);
        window.addEventListener('resize', () => closeRowMenus());

        /* ─── Toolbar action menu ───────────────────────── */
        /* The toolbar is one "⋯" button; its menu is static HTML with
           `data-i18n` labels, so only the tooltip has to be re-set on a
           language switch (it is an attribute, not a text node). */
        function updateActionsTitle() {
            const btn = document.getElementById('files-actions-btn');
            btn.title = tr('files.actions');
            btn.setAttribute('aria-label', tr('files.actions'));
        }

        /* Which items apply right now: everything that writes needs a mounted
           volume, formatting is offered for the card alone (the internal FAT
           has no business being reformatted from here). */
        function updateToolbarState() {
            const mounted = !!(filesState.current && filesState.current.mounted);
            const isSd = filesState.volume === 'sd';
            const set = (id, enabled, hidden) => {
                const el = document.getElementById(id);
                el.disabled = !enabled;
                el.style.display = hidden ? 'none' : '';
            };
            set('files-menu-new-file', mounted, false);
            set('files-menu-new-folder', mounted, false);
            set('files-menu-upload-file', mounted, false);
            set('files-menu-upload-folder', mounted, false);
            set('files-menu-select-all', filesState.entries.length > 0, false);
            // Bulk actions need a selection: a disabled item says "tick something
            // first" far better than an error after the click.
            const hasSelection = filesState.selected.size > 0;
            set('files-menu-move', mounted && hasSelection, false);
            set('files-menu-copy', mounted && hasSelection, false);
            set('files-menu-delete-selected', mounted && hasSelection, false);
            set('files-menu-refresh', true, false);
            set('files-menu-format', mounted && isSd, !isSd);
            set('files-menu-check', mounted, false);

            // The select-all item doubles as "clear": once every row is ticked
            // the only thing left to do is untick them again.
            const allSelected = filesState.entries.length > 0 &&
                                filesState.selected.size >= filesState.entries.length;
            document.getElementById('files-menu-select-all').textContent =
                allSelected ? tr('files.select_none') : tr('files.select_all');
        }

        function toggleToolbarMenu() {
            const btn = document.getElementById('files-actions-btn');
            const menu = document.getElementById('files-actions-menu');

            const wasOpen = menu.classList.contains('open');
            closeRowMenus();
            if (wasOpen) return;

            menu.classList.add('open');

            const r = btn.getBoundingClientRect();
            const menuRect = menu.getBoundingClientRect();
            let top = r.bottom + 4;
            if (top + menuRect.height > window.innerHeight - 8) {
                top = Math.max(8, r.top - menuRect.height - 4);
            }
            let left = r.right - menuRect.width;
            if (left < 8) left = 8;

            menu.style.top = top + 'px';
            menu.style.left = left + 'px';
        }

        function initToolbarMenu() {
            const on = (id, fn) => document.getElementById(id).addEventListener('click', fn);
            on('files-actions-btn', (ev) => {
                ev.stopPropagation();
                toggleToolbarMenu();
            });
            on('files-menu-new-file', () => createFile());
            on('files-menu-new-folder', () => createFolder());
            on('files-menu-select-all', () => selectAllToggle());
            on('files-menu-upload-file', () => pickUpload());
            on('files-menu-upload-folder', () => pickFolder());
            on('files-menu-move', () => startTransfer('move'));
            on('files-menu-copy', () => startTransfer('copy'));
            on('files-menu-delete-selected', () => deleteSelected());
            on('files-menu-refresh', () => reloadFiles());
            on('files-menu-format', () => formatVolume());
            on('files-menu-check', () => startCheck());
        }

        async function loadList() {
            // A selection belongs to one directory: browsing elsewhere drops it,
            // while a refresh of the same listing keeps it (that is what makes a
            // bulk operation repeatable).
            const key = filesState.volume + filesState.path;
            if (key !== filesState.listKey) {
                filesState.selected.clear();
                filesState.listKey = key;
            }
            renderBreadcrumbs();
            const url = '/api/files/list?volume=' + encodeURIComponent(filesState.volume) +
                        '&path=' + encodeURIComponent(filesState.path);
            let resp;
            try {
                resp = await apiFetch(url);
            } catch (e) {
                filesStatus(tr('files.load_fail') + ': ' + e, 'fail');
                return;
            }
            if (!resp.ok) {
                filesStatus(tr('files.load_fail') + ': ' + await filesError(resp), 'fail');
                document.getElementById('files-tbody').innerHTML = '';
                return;
            }
            const data = await resp.json();
            filesState.path = data.path || filesState.path;
            renderBreadcrumbs();
            renderRows(data.entries || []);
        }

        async function reloadFiles() {
            await loadVolumes();
            await loadList();
            await loadFilesSettings();
        }

        /* ─── In-page modal dialog ──────────────────────── */
        /* The dialog lives in app.js now (`showDialog`), so the other pages ask
           their questions with the very same one. The wrapper keeps this page's
           call sites as they were: they pass title/hint/value/okLabel/danger/
           withInput/extraLabel and get back the typed value, `true`, 'extra' or
           null. */
        const filesModalOpen = (opts) => showDialog(opts);

        /* ─── Selection ─────────────────────────────────── */
        /* The set holds NAMES of the current directory: the table is rebuilt on
           every refresh, so the checkboxes are always rendered from it. */
        function setSelected(name, on) {
            if (on) filesState.selected.add(name);
            else filesState.selected.delete(name);

            const row = document.querySelector('#files-tbody tr[data-name="' +
                          CSS.escape(name) + '"]');
            if (row) row.classList.toggle('files-row-selected', on);
            updateToolbarState();
        }

        function selectAllToggle() {
            const all = filesState.entries.length > 0 &&
                        filesState.selected.size >= filesState.entries.length;
            filesState.selected.clear();
            if (!all) filesState.entries.forEach(e => filesState.selected.add(e.name));
            renderRows(filesState.entries);
        }

        /* Only names that are still in the listing: a selection that survived a
           refresh somewhere else would otherwise fail with a puzzling error. */
        function selectedEntries() {
            return filesState.entries.filter(e => filesState.selected.has(e.name));
        }

        /* ─── Bulk operations ───────────────────────────── */
        async function deleteSelected() {
            const entries = selectedEntries();
            if (entries.length === 0) {
                filesStatus(tr('files.nothing_selected'), 'fail');
                return;
            }

            const confirmed = await filesModalOpen({
                title: tr('files.delete_selected') + ' (' + entries.length + ')?',
                hint: tr('files.delete_selected_hint'),
                danger: true,
                okLabel: tr('files.delete'),
            });
            if (!confirmed) return;

            let done = 0, firstError = '';
            for (const entry of entries) {
                // `recursive` is always on: the confirmation above states that
                // folders go with their contents, and asking once per folder
                // would turn one decision into a dialog storm.
                const resp = await apiFetch('/api/files/delete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ volume: filesState.volume,
                                           path: filesJoin(filesState.path, entry.name),
                                           recursive: true }),
                });
                if (resp.ok) done++;
                else if (!firstError) firstError = entry.name + ': ' + await filesError(resp);
            }

            filesState.selected.clear();
            let summary = tr('files.delete_done') + ' ' + done + ' / ' + entries.length;
            if (firstError) summary += '   ·   ' + tr('files.fail') + ': ' + firstError;
            filesStatus(summary, firstError ? 'fail' : 'ok');
            await loadList();
        }

        /* ─── Destination picker (move / copy) ───────────── */
        /* A small directory browser: a folder is entered by clicking it, the
           volume is switched with the buttons on top, and the confirmation says
           what it does ("Move here" / "Copy here"). Only directories are listed
           (a file is not a destination), and when the destination volume is the
           source volume, every folder that is part of the selection is left out
           — that makes "a folder into itself" impossible to pick rather than
           something to be refused after the fact. */
        let pickerResolve = null;
        let pickerPath = '/';
        let pickerVolume = '';      // destination volume id
        let pickerOp = 'move';      // 'move' | 'copy'

        function pickerForbidden() {
            // Only the source volume can contain the selection.
            if (pickerVolume !== filesState.volume) return new Set();
            return new Set(selectedEntries()
                .filter(e => e.is_dir)
                .map(e => filesJoin(filesState.path, e.name)));
        }

        /* The picker may look at a volume that is not the one being browsed, so it
           cannot reuse folderListing() — that one is bound to filesState.volume
           (the page's current listing) and would answer about the wrong volume. */
        async function folderListingIn(volume, dir) {
            try {
                const resp = await apiFetch('/api/files/list?volume=' +
                    encodeURIComponent(volume) + '&path=' + encodeURIComponent(dir));
                if (!resp.ok) return null;
                const data = await resp.json();
                return data.entries || [];
            } catch (e) {
                return null;
            }
        }

        function renderPickerVolumes() {
            const box = document.getElementById('files-picker-volumes');
            box.innerHTML = '';
            const mounted = (filesState.volumes || []).filter(v => v.mounted);
            if (mounted.length < 2) return;   // one volume: nothing to choose

            // A label, because a bare pair of buttons does not say what it
            // switches — the destination volume of the transfer.
            const label = document.createElement('span');
            label.className = 'files-picker-volumes-label';
            label.textContent = tr('files.picker_dest');
            box.appendChild(label);

            mounted.forEach(v => {
                const b = document.createElement('button');
                b.type = 'button';
                b.className = 'files-picker-item vol' + (v.id === pickerVolume ? ' active' : '');
                b.textContent = tr(v.id === 'fat' ? 'files.volume_fat' : 'files.volume_sd');
                b.onclick = () => { pickerVolume = v.id; pickerEnter('/'); };
                box.appendChild(b);
            });
        }

        function pickerMessage(list, text) {
            const p = document.createElement('p');
            p.className = 'hint';
            p.textContent = text;
            list.appendChild(p);
        }

        async function pickerEnter(path) {
            pickerPath = path;
            renderPickerVolumes();

            // The destination is a pair (volume, folder) — and the root of a
            // volume is a perfectly good folder. Naming the volume in the path
            // line is what makes "confirm right here" readable as a choice
            // instead of an empty dead end.
            const sameVolume = (pickerVolume === filesState.volume);
            const isSource = sameVolume && path === filesState.path;
            const volumeName = tr(pickerVolume === 'fat' ? 'files.volume_fat'
                                                        : 'files.volume_sd');

            const pathEl = document.getElementById('files-picker-path');
            pathEl.textContent = volumeName + ' · ' + path +
                (isSource ? '   (' + tr('files.picker_source') + ')' : '');

            const list = document.getElementById('files-picker-list');
            list.innerHTML = '';

            // "⬆ Вверх" — everywhere except at the volume root. It is the first
            // row so a deep folder can always be left again.
            if (path !== '/') {
                const up = document.createElement('button');
                up.type = 'button';
                up.className = 'files-picker-item up';
                up.textContent = '⬆ ' + tr('files.up');
                up.onclick = () => pickerEnter(filesParent(path));
                list.appendChild(up);
            }

            // The source directory is never a destination: moving or copying
            // into itself would be a no-op, and the button says so instead of
            // failing later. Another volume has no such case.
            document.getElementById('files-picker-ok').disabled = isSource;

            const entries = await folderListingIn(pickerVolume, path);
            if (entries === null) {
                pickerMessage(list, tr('files.load_fail'));
                return;
            }
            const forbidden = pickerForbidden();
            const dirs = entries.filter(e => e.is_dir &&
                !forbidden.has(filesJoin(path, e.name)));
            if (dirs.length === 0) {
                // An empty folder list is NOT a dead end: the destination folder
                // itself (usually the root of the other volume) is what the
                // button confirms. Say that — and say why the button is off in
                // the source folder.
                pickerMessage(list, isSource ? tr('files.picker_source_hint')
                                            : tr('files.picker_no_dirs'));
                return;
            }
            dirs.forEach(e => {
                const b = document.createElement('button');
                b.type = 'button';
                b.className = 'files-picker-item';
                b.textContent = '📁 ' + e.name;
                b.onclick = () => pickerEnter(filesJoin(path, e.name));
                list.appendChild(b);
            });
        }

        function pickerOpen(op, count) {
            pickerOp = op;
            pickerVolume = filesState.volume;
            document.getElementById('files-picker-title').textContent =
                tr(op === 'move' ? 'files.picker_title' : 'files.picker_title_copy');
            document.getElementById('files-picker-ok').textContent =
                tr(op === 'move' ? 'files.move_here' : 'files.copy_here');
            document.getElementById('files-picker-hint').textContent =
                tr('files.picker_selected') + ': ' + count;
            document.getElementById('files-picker').style.display = 'flex';
            pickerEnter(filesState.path);
            return new Promise(resolve => { pickerResolve = resolve; });
        }

        function movePickerClose(result) {
            document.getElementById('files-picker').style.display = 'none';
            const resolve = pickerResolve;
            pickerResolve = null;
            if (resolve) resolve(result);
        }

        document.getElementById('files-picker-cancel').onclick = () => movePickerClose(null);
        // The answer is a pair (volume, folder): the picker may have been switched
        // to the other volume before the operator confirmed.
        document.getElementById('files-picker-ok').onclick = () =>
            movePickerClose({ volume: pickerVolume, path: pickerPath });
        document.getElementById('files-picker').onclick = (ev) => {
            // Only a click on the backdrop itself (not inside the card) closes it.
            if (ev.target === document.getElementById('files-picker')) movePickerClose(null);
        };

        /* ─── Copy / move between volumes ────────────────── */
        /* The device does the work in a task of its own (a directory of a card is
           gigabytes), so this side only asks and then follows: the POST starts
           the job, the GET reports it, and a name that is already taken in the
           destination comes back as `409` *before* anything is copied — that
           answer is what the three-choice dialog exists for. Nothing is guessed
           about the outcome here: the summary is built from the same counters the
           device reports. */
        let transferTimer = null;
        let transferIdle = 0;

        /** How many polls without any report before the page gives up (2 s each) */
        const kTransferIdleLimit = 5;

        async function conflictDialog(names) {
            const shown = names.slice(0, 5).join(', ') + (names.length > 5 ? ', …' : '');
            const answer = await filesModalOpen({
                title: tr('files.conflict_title') + ' (' + names.length + ')',
                hint: shown + '   ·   ' + tr('files.conflict_hint'),
                okLabel: tr('files.conflict_overwrite'),
                extraLabel: tr('files.conflict_skip'),
            });
            if (answer === true) return 'overwrite';
            if (answer === 'extra') return 'skip';
            return null;                     // cancelled
        }

        function transferRequest(body) {
            return apiFetch('/api/files/transfer', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body),
            });
        }

        async function startTransfer(op) {
            const entries = selectedEntries();
            if (entries.length === 0) {
                filesStatus(tr('files.nothing_selected'), 'fail');
                return;
            }

            const target = await pickerOpen(op, entries.length);
            if (!target) return;

            const body = {
                op: op,
                src_volume: filesState.volume,
                paths: entries.map(e => filesJoin(filesState.path, e.name)),
                dst_volume: target.volume,
                dst_path: target.path,
                conflict: 'ask',
            };

            let resp = await transferRequest(body);
            if (resp.status === 409) {
                const data = await resp.json().catch(() => null);
                const names = ((data && data.conflicts) || []).map(c => c.name);
                const policy = await conflictDialog(names);
                if (!policy) return;         // the operator changed their mind
                body.conflict = policy;
                resp = await transferRequest(body);
            }

            if (!resp.ok) {
                filesStatus(tr('files.transfer_fail') + ': ' + await filesError(resp), 'fail');
                return;
            }

            filesState.selected.clear();
            renderRows(filesState.entries);
            transferFollow();
        }

        function cancelTransfer() {
            apiFetch('/api/files/transfer/cancel', { method: 'POST' });
        }

        function transferFollow() {
            // The same row the uploads use. The pause button has no meaning for a
            // transfer (it cannot be resumed), so it goes away while one runs.
            document.getElementById('files-progress-row').style.display = '';
            document.getElementById('files-pause-btn').style.display = 'none';
            document.getElementById('files-cancel-btn').onclick = () => cancelTransfer();
            if (transferTimer) clearInterval(transferTimer);
            transferTimer = setInterval(transferTick, 500);
            transferIdle = 0;
            transferTick();
        }

        function transferStop() {
            if (transferTimer) { clearInterval(transferTimer); transferTimer = null; }
            document.getElementById('files-progress-row').style.display = 'none';
            document.getElementById('files-pause-btn').style.display = '';
            // Hand the row back to the upload code, which sets its own handler
            // again when a new upload starts.
            document.getElementById('files-cancel-btn').onclick = () => cancelUpload();
        }

        async function transferTick() {
            const resp = await apiFetch('/api/files/transfer');
            if (!resp.ok) { transferStop(); return; }
            const r = await resp.json().catch(() => null);
            if (!r) { transferStop(); return; }

            const label = document.getElementById('files-progress-label');
            const percent = document.getElementById('files-progress-percent');
            const bar = document.getElementById('files-progress-bar');
            const opName = tr(r.op === 'move' ? 'files.move' : 'files.copy');

            if (r.phase === 'measuring') {
                // The walk moves no bytes, so there is no percentage yet: say what
                // is happening instead of leaving a bar sitting at zero.
                label.textContent = opName + ' · ' + tr('files.transfer_measuring') +
                                    ' (' + r.files_total + ')';
                percent.textContent = '';
                bar.style.width = '0%';
                return;
            }

            if (r.busy) {
                const done = r.total_bytes > 0
                    ? Math.min(100, Math.round(r.done_bytes * 100 / r.total_bytes)) : 0;
                bar.style.width = done + '%';
                percent.textContent = done + ' %';
                label.textContent = opName + ' · ' + (r.current || '') + '   ' +
                                    filesFmtSize(r.done_bytes) + ' / ' + filesFmtSize(r.total_bytes);
                return;
            }

            if (!r.busy && !r.finished) {
                // The device accepted the request but has not reported the job yet.
                // A few polls are normal (the task is starting); a device that never
                // does report must not leave the row sitting there forever.
                if (++transferIdle >= kTransferIdleLimit) {
                    transferStop();
                    filesStatus(tr('files.transfer_fail'), 'fail');
                }
                return;
            }

            transferStop();
            let summary = (r.cancelled ? tr('files.transfer_cancelled')
                                       : tr('files.transfer_done')) +
                          ' · ' + r.files_done + ' / ' + r.files_total;
            if (r.skipped > 0) summary += '   ·   ' + tr('files.transfer_skipped') + ': ' + r.skipped;
            if (r.failed > 0) {
                summary += '   ·   ' + tr('files.fail') + ': ' + r.failed;
                if (r.error_path || r.error) summary += ' (' + (r.error_path || r.error) + ')';
            }
            filesStatus(summary, (r.failed > 0 || r.error) ? 'fail' : 'ok');
            await loadList();
        }

        /* ─── Volume check ("Check for errors") ──────────── */
        /* The walk happens on the device and can take minutes, so the dialog
           FOLLOWS it through `GET /api/files/check` — a snapshot endpoint, so a
           poll in mid-walk is simply progress — and the operator can stop it
           with one call. Nothing is written by the check itself: FatFs has no
           fsck, so the only honest "repair" it can offer afterwards is removing
           the entries that cannot be read any more, or formatting the card. */
        let checkTimer = null;
        let checkLast = {};

        function renderCheck(r) {
            checkLast = r;
            const stateEl = document.getElementById('files-check-state');
            const listEl = document.getElementById('files-check-errors');
            const closeBtn = document.getElementById('files-check-close');
            const delBtn = document.getElementById('files-check-delete');
            const fmtBtn = document.getElementById('files-check-format');

            document.getElementById('files-check-current').textContent = r.current || '';
            listEl.innerHTML = '';

            const counters = tr('files.check_dirs') + ' ' + (r.dirs || 0) + '   ·   ' +
                             tr('files.check_files') + ' ' + (r.files || 0) + '   ·   ' +
                             filesFmtSize(r.bytes_read || 0) + ' / ' +
                             filesFmtSize(r.budget_bytes || 0);

            if (r.busy) {
                stateEl.className = 'test-conn-result';
                stateEl.textContent = tr('files.check_running') + ': ' + counters;
                closeBtn.textContent = tr('files.check_cancel');
            } else {
                closeBtn.textContent = tr('files.close');
                if (r.cancelled) {
                    stateEl.className = 'test-conn-result test-conn-fail';
                    stateEl.textContent = tr('files.check_cancelled') + ': ' + counters;
                } else if (!r.bad_entries) {
                    stateEl.className = 'test-conn-result test-conn-ok';
                    stateEl.textContent = tr('files.check_clean') + ': ' + counters +
                        (r.truncated ? '   ·   ' + tr('files.check_truncated') : '');
                } else {
                    stateEl.className = 'test-conn-result test-conn-fail';
                    stateEl.textContent = tr('files.check_found') + ': ' + r.bad_entries +
                        '   ·   ' + counters +
                        (r.truncated ? '   ·   ' + tr('files.check_truncated') : '');
                    (r.errors || []).forEach(e => {
                        const row = document.createElement('div');
                        row.className = 'files-check-item';
                        row.textContent = e.path + ' — ' + e.detail;
                        listEl.appendChild(row);
                    });
                }
            }

            // The repair offers appear only after a finished check that found
            // something; formatting is offered for the card alone.
            const canRepair = !r.busy && r.finished && r.bad_entries > 0;
            delBtn.style.display = canRepair ? '' : 'none';
            fmtBtn.style.display = (canRepair && r.volume === 'sd') ? '' : 'none';
        }

        function stopCheckPolling() {
            if (checkTimer) {
                clearInterval(checkTimer);
                checkTimer = null;
            }
        }

        function closeCheck() {
            stopCheckPolling();
            document.getElementById('files-check').style.display = 'none';
        }

        async function pollCheck() {
            let report;
            try {
                report = await fetchJSON('/api/files/check');
            } catch (e) {
                return;              // a hiccup: the next tick tries again
            }
            renderCheck(report);
            if (!report.busy) stopCheckPolling();
        }

        async function startCheck() {
            document.getElementById('files-check').style.display = 'flex';

            // A check may already be running (the page was reloaded): follow it
            // instead of asking for a second walk over the same card.
            let current = null;
            try { current = await fetchJSON('/api/files/check'); } catch (e) { /* ignore */ }
            if (current && current.busy) {
                renderCheck(current);
                stopCheckPolling();
                checkTimer = setInterval(pollCheck, 700);
                return;
            }

            const volume = filesState.volume;
            const empty = { busy: true, finished: false, volume: volume, current: '',
                            dirs: 0, files: 0, bad_entries: 0, bytes_read: 0,
                            budget_bytes: 0, errors: [] };
            renderCheck(empty);

            let resp;
            try {
                resp = await apiFetch('/api/files/check', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ volume: volume }),
                });
            } catch (e) {
                renderCheck({ ...empty, busy: false, finished: true });
                document.getElementById('files-check-state').className =
                    'test-conn-result test-conn-fail';
                document.getElementById('files-check-state').textContent =
                    tr('files.check_start_fail') + ': ' + e;
                return;
            }
            if (!resp.ok) {
                const msg = await filesError(resp);
                renderCheck({ ...empty, busy: false, finished: true });
                document.getElementById('files-check-state').className =
                    'test-conn-result test-conn-fail';
                document.getElementById('files-check-state').textContent =
                    tr('files.check_start_fail') + ': ' + msg;
                return;
            }

            stopCheckPolling();
            checkTimer = setInterval(pollCheck, 700);
        }

        /* FatFs cannot repair a filesystem, so the one "repair" that keeps the
           volume usable is removing the entries that can no longer be read (the
           other offer is formatting the whole card). Only the paths the report
           carried are deleted — a wholesale failure lists the first
           `kCheckMaxErrors` entries and says so through the counter. */
        async function deleteDamaged(volume, paths) {
            if (paths.length === 0) return;

            const confirmed = await filesModalOpen({
                title: tr('files.repair_delete') + ' (' + paths.length + ')?',
                hint: tr('files.repair_hint'),
                danger: true,
                okLabel: tr('files.delete'),
            });
            if (!confirmed) return;

            let done = 0, firstError = '';
            for (const path of paths) {
                const resp = await apiFetch('/api/files/delete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ volume: volume, path: path, recursive: true }),
                });
                if (resp.ok) done++;
                else if (!firstError) firstError = path + ': ' + await filesError(resp);
            }

            let summary = tr('files.delete_done') + ' ' + done + ' / ' + paths.length;
            if (firstError) summary += '   ·   ' + tr('files.fail') + ': ' + firstError;
            filesStatus(summary, firstError ? 'fail' : 'ok');
            await loadList();
        }

        document.getElementById('files-check-close').onclick = async () => {
            if (checkLast.busy) {
                try {
                    await apiFetch('/api/files/check/cancel', { method: 'POST' });
                } catch (e) { /* the walk also stops on its own at the limit */ }
                closeCheck();
                filesStatus(tr('files.check_cancelled'), 'ok');
                return;
            }
            closeCheck();
        };

        document.getElementById('files-check-delete').onclick = () => {
            const paths = (checkLast.errors || []).map(e => e.path);
            const volume = checkLast.volume || filesState.volume;
            closeCheck();
            deleteDamaged(volume, paths);
        };

        document.getElementById('files-check-format').onclick = () => {
            closeCheck();
            formatVolume();
        };

        /* ─── Operations ─────────────────────────────────── */
        /* An empty file is created through the TEXT endpoint: it is the only
           write that creates a missing file (the editor save), and it applies
           the same rules as any other write — atomic `<name>.part` + rename,
           the free-space reserve and the volume's name policy. */
        async function createFile() {
            const name = await filesModalOpen({
                title: tr('files.new_file'),
                withInput: true,
                value: '',
                okLabel: tr('files.create'),
            });
            if (!name) return;

            // `text` must be the LAST member: the firmware reads volume/path
            // from the part of the body before it.
            const resp = await apiFetch('/api/files/text', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ volume: filesState.volume,
                                       path: filesJoin(filesState.path, name),
                                       text: '' }),
            });
            if (!resp.ok) {
                filesStatus(tr('files.fail') + ': ' + await filesError(resp), 'fail');
                return;
            }
            filesStatus(tr('files.ok'), 'ok');
            loadList();
        }

        async function createFolder() {
            const name = await filesModalOpen({
                title: tr('files.new_folder'),
                withInput: true,
                value: '',
                okLabel: tr('files.create'),
            });
            if (!name) return;

            const resp = await apiFetch('/api/files/mkdir', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ volume: filesState.volume,
                                       path: filesJoin(filesState.path, name) }),
            });
            if (!resp.ok) {
                filesStatus(tr('files.fail') + ': ' + await filesError(resp), 'fail');
                return;
            }
            filesStatus(tr('files.ok'), 'ok');
            loadList();
        }

        function pickUpload() {
            const input = document.getElementById('files-upload-input');
            input.value = '';
            input.click();
        }

        function pickFolder() {
            const input = document.getElementById('files-folder-input');
            input.value = '';
            input.click();
        }

        /* ─── Upload controls (pause / cancel) ─────────── */
        /* One state for both upload flows (a single file and a whole folder):
           the buttons live in the progress row, so they are visible exactly
           while something is being sent. Pause drops the request in flight and
           holds the queue behind it, cancel drops the rest of the batch; what
           already arrived stays on the device. */
        const uploadCtl = {
            active: false, paused: false, cancelled: false,
            abort: null, label: '', target: '', waiters: [],
        };

        function uploadBegin() {
            uploadCtl.active = true;
            uploadCtl.paused = false;
            uploadCtl.cancelled = false;
            uploadCtl.abort = null;
            uploadCtl.label = '';
            uploadCtl.target = '';
            setPauseIcon(false);
        }

        function uploadEnd() {
            uploadCtl.active = false;
            uploadCtl.paused = false;
            uploadCtl.abort = null;
            releaseUploadWaiters();
        }

        function releaseUploadWaiters() {
            uploadCtl.waiters.splice(0).forEach(fn => fn());
        }

        function setPauseIcon(paused) {
            const btn = document.getElementById('files-pause-btn');
            if (!btn) return;
            btn.classList.toggle('is-paused', paused);
            const tip = tr(paused ? 'files.resume' : 'files.pause');
            btn.title = tip;
            btn.setAttribute('aria-label', tip);
        }

        /* Both buttons are icons only, so their meaning lives in the tooltip —
           and the pause button's tooltip follows its state. Set here rather than
           through `data-i18n`, which `applyTranslations()` would overwrite on a
           language switch (the same reason the toolbar tooltip has a helper). */
        function updateUploadTitles() {
            const cancel = document.getElementById('files-cancel-btn');
            if (cancel) {
                const tip = tr('files.cancel');
                cancel.title = tip;
                cancel.setAttribute('aria-label', tip);
            }
            setPauseIcon(uploadCtl.paused);
        }

        /* The label keeps the file it belongs to and only gains a "paused"
           marker: during a folder upload the queue position (i / N) is what the
           operator watches while the transfer is on hold. */
        function setUploadLabel(label) {
            if (label !== undefined) uploadCtl.label = label;
            const el = document.getElementById('files-progress-label');
            if (!el) return;
            el.textContent = uploadCtl.paused && uploadCtl.label
                ? tr('files.paused') + '   ·   ' + uploadCtl.label
                : uploadCtl.label;
        }

        function toggleUploadPause() {
            if (!uploadCtl.active || uploadCtl.cancelled) return;
            if (uploadCtl.paused) resumeUpload(); else pauseUpload();
        }

        function pauseUpload() {
            if (!uploadCtl.active || uploadCtl.paused || uploadCtl.cancelled) return;
            uploadCtl.paused = true;
            setPauseIcon(true);
            setUploadLabel();
            // Hanging up at once instead of letting the transfer finish: the
            // operator asked for a stop, and the reply of an aborted request is
            // never used (see the resume path below).
            if (uploadCtl.abort) uploadCtl.abort();
        }

        function resumeUpload() {
            if (!uploadCtl.paused) return;
            uploadCtl.paused = false;
            setPauseIcon(false);
            setUploadLabel();
            releaseUploadWaiters();
        }

        function cancelUpload() {
            if (!uploadCtl.active || uploadCtl.cancelled) return;
            uploadCtl.cancelled = true;
            uploadCtl.paused = false;
            setPauseIcon(false);
            const abort = uploadCtl.abort;
            uploadCtl.abort = null;
            if (abort) abort();
            releaseUploadWaiters();
            // The device keeps the bytes of a paused upload on purpose; a cancel
            // means they are not wanted, so the temporary file goes with them.
            discardPartial(uploadCtl.target);
        }

        /* Throws away the temporary file of an upload (`<name>.part`). The caller
           decides whether to wait: a fresh upload of the same name does (so the
           first chunk cannot land before the old part is gone), a cancel just
           fires it — the operator has already moved on, and a failure only leaves
           a file that the next upload of that name replaces. */
        function discardPartial(target) {
            if (!target) return Promise.resolve();
            return apiFetch('/api/files/upload/cancel?volume=' + encodeURIComponent(filesState.volume) +
                            '&path=' + encodeURIComponent(target), { method: 'POST' })
                .catch(() => {});
        }

        /* Raw-body upload through XHR: fetch() cannot report upload progress,
           and one file per request keeps the firmware's free-space check exact.
           `batch` ({ done, total } in bytes, optional) switches the bar to the
           progress of the WHOLE folder upload: the file counter is already in
           the label, so "how much of the batch is left" is the more useful
           reading there. Without it the bar is that one file.
           `total` in the query turns the request into one piece of a resumable
           upload: the device appends the body to `<name>.part` and answers with
           the offset it reached, so a paused (or interrupted) transfer continues
           where it stopped instead of sending everything again.
           Resolves with an error message, '' when the file arrived, and null
           when the operator cancelled the upload. */
        function uploadOne(file, target, label, batch) {
            const baseUrl = '/api/files/upload?volume=' + encodeURIComponent(filesState.volume) +
                            '&path=' + encodeURIComponent(target) + '&total=' + file.size;

            const row = document.getElementById('files-progress-row');
            const bar = document.getElementById('files-progress-bar');
            const pct = document.getElementById('files-progress-percent');

            const base = batch ? batch.done : 0;
            const total = batch ? batch.total : file.size;
            const showProgress = (loaded) => {
                const sent = base + loaded;
                // A zero-byte total (empty file, empty batch) has no percentage:
                // show an empty bar while it runs and 100 % once it is through.
                const p = total > 0 ? Math.min(100, Math.round(sent * 100 / total))
                                    : (loaded >= file.size ? 100 : 0);
                bar.style.width = p + '%';
                pct.textContent = p + '%';
            };

            row.style.display = '';
            showProgress(0);
            setUploadLabel(label);
            uploadCtl.target = target;

            /* How much of the file the device already has. Asked instead of
               remembered: after a pause — or a connection that dropped — only
               the device knows how many bytes really arrived. */
            const deviceOffset = async () => {
                try {
                    const resp = await apiFetch('/api/files/upload/offset?volume=' +
                        encodeURIComponent(filesState.volume) + '&path=' + encodeURIComponent(target));
                    if (!resp.ok) return 0;
                    const j = await resp.json();
                    const n = Number(j.offset);
                    return (Number.isFinite(n) && n > 0) ? n : 0;
                } catch (e) {
                    return 0;
                }
            };

            const attempt = (offset) => new Promise(resolve => {
                const xhr = new XMLHttpRequest();
                xhr.open('POST', baseUrl + '&offset=' + offset, true);
                xhr.setRequestHeader('Content-Type', 'application/octet-stream');
                const auth = getAuthHeaders();
                Object.keys(auth).forEach(k => xhr.setRequestHeader(k, auth[k]));

                // The operator can drop this request (pause) or the whole
                // upload (cancel); the buttons call these back.
                uploadCtl.abort = () => xhr.abort();

                xhr.upload.onprogress = (ev) => {
                    if (!ev.lengthComputable) return;
                    showProgress(offset + ev.loaded);
                };
                xhr.onload = () => {
                    uploadCtl.abort = null;
                    let body = null;
                    try { body = JSON.parse(xhr.responseText); } catch (e) { /* not JSON */ }
                    if (xhr.status < 200 || xhr.status >= 300) {
                        let msg = 'HTTP ' + xhr.status;
                        if (body) {
                            if (body.message) msg = body.message;
                            if (body.detail) msg += ' (' + body.detail + ')';
                        }
                        resolve({ error: msg });
                        return;
                    }
                    // `partial` means the bytes are on the device and it knows
                    // where to go on; `ok` means the file is complete.
                    const next = (body && Number.isFinite(Number(body.offset)))
                               ? Number(body.offset) : file.size;
                    resolve({ offset: next });
                };
                xhr.onerror = () => {
                    uploadCtl.abort = null;
                    resolve({ error: 'network error' });
                };
                // Only pause and cancel abort the request, so this is not a
                // failure — it means "stop this attempt", nothing else.
                xhr.onabort = () => {
                    uploadCtl.abort = null;
                    resolve({ aborted: true });
                };
                xhr.send(file.slice(offset));
            });

            return (async () => {
                // A fresh upload of this name starts over: whatever an earlier
                // paused upload left behind belongs to a file that may be a
                // different one. Awaited, so the first chunk cannot arrive before
                // the old part is gone.
                await discardPartial(target);

                let stalls = 0;
                let previous = -1;
                for (;;) {
                    // Also covers a pause pressed *between* two files: the next
                    // one waits here instead of starting anyway.
                    while (uploadCtl.paused && !uploadCtl.cancelled) {
                        await new Promise(res => uploadCtl.waiters.push(res));
                    }
                    if (uploadCtl.cancelled) return null;

                    const offset = await deviceOffset();
                    if (uploadCtl.cancelled) return null;
                    showProgress(offset);

                    // Nothing moved since the last attempt: without this the loop
                    // would hammer a device that keeps refusing the same bytes.
                    if (offset === previous && ++stalls >= 3) {
                        if (batch) batch.done += file.size;
                        return tr('files.upload_stuck');
                    }
                    previous = offset;

                    const r = await attempt(offset);
                    if (r.aborted) continue;   // paused: wait, then ask again
                    if (r.error) {
                        if (batch) batch.done += file.size;
                        return r.error;
                    }
                    if (r.offset >= file.size) {
                        if (batch) batch.done += file.size;
                        return '';
                    }
                    // The device took a part of the file (or only part of the
                    // body arrived): send the rest, without asking the operator.
                }
            })();
        }

        async function uploadFile(file) {
            if (!file) return;

            uploadBegin();
            const err = await uploadOne(file, filesJoin(filesState.path, file.name),
                                        tr('files.uploading') + ' ' + file.name);
            const cancelled = uploadCtl.cancelled;
            uploadEnd();
            // The row is hidden by the flow, not per file: during a folder upload
            // it stays visible (with the buttons) until the whole batch is done.
            document.getElementById('files-progress-row').style.display = 'none';

            if (cancelled) {
                filesStatus(tr('files.upload_cancelled') + ': ' + file.name);
                loadList();
                return;
            }
            if (err) {
                filesStatus(tr('files.upload_fail') + ': ' + err, 'fail');
                return;
            }
            filesStatus(tr('files.upload_ok') + ': ' + file.name, 'ok');
            loadList();
        }

        /* ─── Upload folder ──────────────────────────────── */
        /* The browser hands over a flat list of files that carry their relative
           path, so the tree has to be rebuilt on the device: every target
           directory is created first (depth order — the API refuses a missing
           parent), then the files are uploaded one at a time, because the
           firmware streams exactly one file per request and checks the free
           space for that file. Each directory is listed once up front: that
           tells us which names already exist (the overwrite question) and keeps
           the listing requests out of the upload loop. */
        async function folderExistingNames(dir) {
            const entries = await folderListing(dir);
            return new Set((entries || []).map(e => e.name.toLowerCase()));
        }

        /* One listing call, two uses: the overwrite question of a folder upload
           and the destination check of a move. `null` means "no such
           directory" (the upload treats that as empty, the move as an error). */
        async function folderListing(dir) {
            try {
                const resp = await apiFetch('/api/files/list?volume=' +
                    encodeURIComponent(filesState.volume) +
