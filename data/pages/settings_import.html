<!DOCTYPE html>
<html lang="ru" data-page="settings_import">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Import Settings — DHCPServer</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div id="header-placeholder"></div>

    <main class="container">
        <h1 data-i18n="settings_import.title">Import Settings</h1>

        <div class="card">
            <p data-i18n="settings_import.desc">Choose a settings backup file (*.conf, JSON) exported earlier and apply it. Only parameters supported by this firmware version are imported.</p>

            <input type="file" id="import-file" accept=".conf,.json">
            <button class="btn btn-primary" onclick="importSettings()" data-i18n="settings_import.button">Import</button>
            <div id="import-result"></div>
        </div>
    </main>

    <div id="footer-placeholder"></div>
    <script src="../js/app.js"></script>
    <script>
        async function importSettings() {
            const fileInput = document.getElementById('import-file');
            const out = document.getElementById('import-result');
            out.textContent = '';

            const file = fileInput.files && fileInput.files[0];
            if (!file) {
                out.textContent = tr('settings_import.error') + ' no file';
                return;
            }

            const text = await file.text();
            let parsed = null;
            try { parsed = JSON.parse(text); } catch (e) { /* keep null */ }
            if (!parsed || parsed.format !== 'dhcpserver-settings') {
                out.textContent = tr('settings_import.error') + ' bad format';
                return;
            }

            let resp;
            try {
                resp = await apiFetch('/api/settings/import', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: text,
                });
            } catch (e) {
                out.textContent = tr('settings_import.error') + ' ' + e;
                return;
            }
            const r = await resp.json();

            const lines = [tr('settings_import.ok')];
            if (r.version_mismatch) {
                lines.push(tr('settings_import.version_mismatch') + ': ' +
                           (r.file_version || '?') + ' → ' + (r.firmware_version || '?'));
            }
            if (r.file_newer) lines.push(tr('settings_import.file_newer'));
            if (r.reboot_required) lines.push(tr('settings_import.reboot_required'));
            // What actually landed: the answer carries a flag per section, so the
            // operator sees the restore instead of trusting one word "ok". The
            // names are the sections of a settings file, spelled out — the menu
            // entries of the sub-pages collide (three of them are "General").
            if (r.imported) {
                const applied = [
                    ['settings_import.sec_dhcp', r.imported.dhcp],
                    ['settings_import.sec_static_bindings', r.imported.static_bindings],
                    ['settings_import.sec_allowed', r.imported.allowed_computers],
                    ['settings_import.sec_dns', r.imported.dns],
                    ['settings_import.sec_time', r.imported.time],
                    ['settings_import.sec_local_hosts', r.imported.local_hosts],
                    ['settings_import.sec_security', r.imported.security],
                    ['settings_import.sec_files', r.imported.files],
                ].filter(pair => pair[1]).map(pair => tr(pair[0]));
                if (applied.length) {
                    lines.push(tr('settings_import.applied') + ' ' + applied.join(', '));
                }
            }
            if (Array.isArray(r.warnings) && r.warnings.length) {
                lines.push(tr('settings_import.warnings') + ' ' + r.warnings.join('; '));
            }
            if (Array.isArray(r.skipped_fields) && r.skipped_fields.length) {
                lines.push(tr('settings_import.skipped') + ' ' + r.skipped_fields.join(', '));
            }
            out.textContent = lines.join('\n');
        }
    </script>
</body>
</html>
