<!DOCTYPE html>
<html lang="ru" data-page="dns">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internal Cache — DHCPServer</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div id="header-placeholder"></div>

    <main class="container">
        <h1 data-i18n="dns_internal.title">Internal Cache</h1>

        <div class="card toggle-row">
            <span data-i18n="dns_internal.enabled">Internal cache (PSRAM)</span>
            <label class="toggle-switch">
                <input type="checkbox" id="dns-internal" onchange="toggleInternalCache()">
                <span class="toggle-slider"></span>
            </label>
        </div>

        <div id="dns-internal-options" style="display:none;">
            <!-- One card, two switches: the statistics switch lives here by the
                 operator's request, the cache switch moved down into the Cache
                 card where the rest of the cache controls are. -->
            <div class="card">
                <div class="toggle-row" style="margin-bottom:0.5rem;">
                    <span data-i18n="dns_internal.ignore_ttl">Ignore TTL</span>
                    <label class="toggle-switch">
                        <input type="checkbox" id="dns-internal-ignore-ttl" onchange="toggleInternalIgnoreTtl()">
                        <span class="toggle-slider"></span>
                    </label>
                </div>
                <div class="toggle-row" style="margin-bottom:0.5rem;">
                    <span data-i18n="dns_internal.save_stats">Save statistics before reboot</span>
                    <label class="toggle-switch">
                        <input type="checkbox" id="dns-internal-save-stats" onchange="toggleInternalSaveStats()">
                        <span class="toggle-slider"></span>
                    </label>
                </div>
            </div>

            <!-- Persistence: save the PSRAM cache to /fat/cache.dat and restore it -->
            <div class="card" id="dns-internal-persist">
                <div class="toggle-row" style="margin-bottom:0.5rem;">
                    <span data-i18n="dns_internal.file">Cache file</span>
                    <span id="dns-internal-file-status" class="test-conn-result"></span>
                </div>
                <div class="test-conn-row">
                    <button class="btn btn-primary" onclick="saveInternalCacheFile(this)" data-i18n="dns_internal.save_file">Save to file</button>
                    <button class="btn" onclick="loadInternalCacheFile(this)" data-i18n="dns_internal.load_file">Load from file</button>
                    <button class="btn" onclick="resetInternalCache(this)" data-i18n="dns_internal.reset">Reset</button>
                </div>
                <div class="toggle-row">
                    <span data-i18n="dns_internal.save_cache">Save cache before reboot</span>
                    <label class="toggle-switch">
                        <input type="checkbox" id="dns-internal-save-cache" onchange="toggleInternalSaveCache()">
                        <span class="toggle-slider"></span>
                    </label>
                </div>

                <div class="toggle-row">
                    <span data-i18n="dns_internal.autosave">Autosave</span>
                    <label class="toggle-switch">
                        <input type="checkbox" id="dns-internal-autosave" onchange="toggleInternalAutosave()">
                        <span class="toggle-slider"></span>
                    </label>
                </div>
                <div class="toggle-row" id="dns-internal-autosave-period-row" style="display:none;">
                    <span data-i18n="dns_internal.autosave_period">Save every</span>
                    <span>
                        <input type="number" id="dns-internal-autosave-interval"
                               min="1" max="24" step="1" value="1" style="width:4.5rem;"
                               oninput="applyAutosaveIntervalMax()">
                        <select id="dns-internal-autosave-unit" onchange="applyAutosaveIntervalMax()">
                            <option value="2" data-i18n="dns_internal.period_minute">minutes</option>
                            <option value="0" data-i18n="dns_internal.period_hour">hours</option>
                            <option value="1" data-i18n="dns_internal.period_day">days</option>
                        </select>
                        <button class="btn btn-primary" onclick="saveInternalAutosavePeriod(this)"
                                data-i18n="dns_internal.autosave_save">Save</button>
                    </span>
                </div>

                <!-- Live progress while a save/load job is running -->
                <div id="dns-internal-progress-row" style="display:none; margin-top:0.6rem;">
                    <div style="display:flex; justify-content:space-between; font-size:0.85rem; margin-bottom:0.3rem;">
                        <span id="dns-internal-progress-label"></span>
                        <span id="dns-internal-progress-percent"></span>
                    </div>
                    <div class="meter-track" style="height:8px;">
                        <div class="meter-fill ic-fill" id="dns-internal-progress-bar" style="width:0%;"></div>
                    </div>
                    <p id="dns-internal-progress-done" class="hint"></p>
                </div>
                <p class="hint" data-i18n="dns_internal.file_hint">The cache is written to /fat/cache.dat and restored automatically on boot.</p>
            </div>
        </div>

        <p id="dns-internal-psram-note" style="display:none; color:#f59e0b;" data-i18n="dns_internal.psram_note">Internal cache is unavailable — no PSRAM detected on this device.</p>
    </main>

    <div id="footer-placeholder"></div>
    <script src="../js/app.js"></script>
    <script>
        let internalAvailable = false;

        async function loadInternalCacheSettings() {
            const data = await fetchJSON('/api/dns/settings');
            internalAvailable = !!data.cache_internal_available;
            const cb = document.getElementById('dns-internal');
            cb.checked = !!data.cache_internal;
            const ittl = document.getElementById('dns-internal-ignore-ttl');
            ittl.checked = !!data.cache_internal_ignore_ttl;
            // Absent field = the firmware's own default, which is ON; showing it
            // off would make the page disagree with the device.
            const sst = document.getElementById('dns-internal-save-stats');
            sst.checked = (data.cache_internal_save_stats === undefined)
                ? true : !!data.cache_internal_save_stats;
            const sca = document.getElementById('dns-internal-save-cache');
            sca.checked = (data.cache_internal_save_cache === undefined)
                ? true : !!data.cache_internal_save_cache;
            // Stage 153: autosave is off unless the device says otherwise, and
            // its period selector only shows while the switch is on.
            const auto = document.getElementById('dns-internal-autosave');
            auto.checked = !!data.cache_internal_autosave;
            auto.disabled = !internalAvailable;
            const unit = document.getElementById('dns-internal-autosave-unit');
            unit.value = String(Number(data.cache_internal_autosave_period) || 0);
            const field = document.getElementById('dns-internal-autosave-interval');
            field.value = String(Number(data.cache_internal_autosave_interval) || 1);
            applyAutosaveIntervalMax();
            updateAutosavePeriodVisibility();
            // The internal cache needs PSRAM — disable the toggle without it.
            cb.disabled = !internalAvailable;
            const note = document.getElementById('dns-internal-psram-note');
            if (note) note.style.display = internalAvailable ? 'none' : 'block';
            updateInternalOptionsVisibility();
        }

        // Ignore-TTL only makes sense while the cache is enabled and PSRAM
        // exists — show/hide that block together with the master toggle.
        function updateInternalOptionsVisibility() {
            const opt = document.getElementById('dns-internal-options');
            if (!opt) return;
            const cb = document.getElementById('dns-internal');
            const active = internalAvailable && cb.checked;
            opt.style.display = active ? 'block' : 'none';
            const ittl = document.getElementById('dns-internal-ignore-ttl');
            if (ittl) ittl.disabled = !active;
            const sst = document.getElementById('dns-internal-save-stats');
            if (sst) sst.disabled = !active;
            const sca = document.getElementById('dns-internal-save-cache');
            if (sca) sca.disabled = !active;
        }

        async function toggleInternalCache() {
            const cb = document.getElementById('dns-internal');
            const checked = cb.checked;
            const result = await saveDnsPartial({ cache_internal: checked });
            if (result.status === 'error') {
                await showDialog({ title: tr('common.error'),
                                   hint: result.message || tr('common.unknown_error'),
                                   hideCancel: true });
                cb.checked = !checked;
            }
            updateInternalOptionsVisibility();
            if (cb.checked) updateInternalCacheFileStatus();
        }

        async function toggleInternalIgnoreTtl() {
            const ittl = document.getElementById('dns-internal-ignore-ttl');
            const checked = ittl.checked;
            const result = await saveDnsPartial({ cache_internal_ignore_ttl: checked });
            if (result.status === 'error') {
                await showDialog({ title: tr('common.error'),
                                   hint: result.message || tr('common.unknown_error'),
                                   hideCancel: true });
                ittl.checked = !checked;
            }
        }

        /* The device keeps the main-page counters (From cache / Forward / Avg hit)
           across a restart: it writes Statistica.dat before rebooting — from the
           Reboot button, a firmware update or the terminal menu — and reads it
           back once at boot. A lost file only means the page starts from zero. */
        async function toggleInternalSaveStats() {
            const sst = document.getElementById('dns-internal-save-stats');
            const checked = sst.checked;
            const result = await saveDnsPartial({ cache_internal_save_stats: checked });
            if (result.status === 'error') {
                await showDialog({ title: tr('common.error'),
                                   hint: result.message || tr('common.unknown_error'),
                                   hideCancel: true });
                sst.checked = !checked;
            }
        }

        /* The cache itself (cache.dat) is kept across a planned restart the same
           way: the device writes the whole table to /fat/cache.dat before it
           reboots — the Reboot button, a firmware update or the terminal menu —
           and loads it again at boot. It is megabytes, so the device stays up
           for a moment longer before it actually restarts. */
        async function toggleInternalSaveCache() {
            const sca = document.getElementById('dns-internal-save-cache');
            const checked = sca.checked;
            const result = await saveDnsPartial({ cache_internal_save_cache: checked });
            if (result.status === 'error') {
                await showDialog({ title: tr('common.error'),
                                   hint: result.message || tr('common.unknown_error'),
                                   hideCancel: true });
                sca.checked = !checked;
            }
        }

        // ─── Persistence (cache.dat on FAT) ───

        /* Stage 153: the device writes the cache to the card by itself — every
           hour, every day or every thirty days. A manual save shifts that
           countdown, so the next automatic one is a whole period away. */
        async function toggleInternalAutosave() {
            const box = document.getElementById('dns-internal-autosave');
            const checked = box.checked;
            updateAutosavePeriodVisibility();
            const result = await saveDnsPartial({ cache_internal_autosave: checked });
            if (result.status === 'error') {
                await showDialog({ title: tr('common.error'),
                                   hint: result.message || tr('common.unknown_error'),
                                   hideCancel: true });
                box.checked = !checked;
                updateAutosavePeriodVisibility();
            }
        }

        // The interval is how many of the unit fit into the next one up: 60
        // minutes in an hour, 24 hours in a day, and for days the length of the
        // month we are in right now (28…31) — the browser's own up/down arrows
        // walk inside that range, and the maximum is recomputed when the unit
        // changes.
        function autosaveIntervalMax(unitValue) {
            const unit = Number(unitValue);
            if (unit === 2) return 60;                       // minutes
            if (unit === 0) return 24;                       // hours
            const now = new Date();
            return new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
        }

        function applyAutosaveIntervalMax() {
            const unit = document.getElementById('dns-internal-autosave-unit');
            const field = document.getElementById('dns-internal-autosave-interval');
            if (!unit || !field) return;
            const max = autosaveIntervalMax(unit.value);
            field.max = String(max);
            const value = Number(field.value) || 1;
            if (value > max) field.value = String(max);
            if (value < 1) field.value = '1';
        }

        async function saveAutosavePeriod() {
            const unit = document.getElementById('dns-internal-autosave-unit');
            const field = document.getElementById('dns-internal-autosave-interval');
            const result = await saveDnsPartial({
                cache_internal_autosave_period: Number(unit.value) || 0,
                cache_internal_autosave_interval: Number(field.value) || 1,
            });
            if (result.status === 'error') {
                await showDialog({ title: tr('common.error'),
                                   hint: result.message || tr('common.unknown_error'),
                                   hideCancel: true });
            }
        }

        // The unit and the number are only prepared here: the device is told
        // when the operator presses Save, so a half-typed interval never reaches
        // the settings (and never restarts the timer twice).
        async function saveInternalAutosavePeriod(btn) {
            applyAutosaveIntervalMax();
            const out = document.getElementById('dns-internal-file-status');
            if (btn) btn.disabled = true;
            if (out) {
                out.textContent = tr('dns_internal.saving');
                out.className = 'test-conn-result test-conn-warn';
            }
            await saveAutosavePeriod();
            if (out) {
                out.textContent = tr('dns_internal.saved');
                out.className = 'test-conn-result test-conn-ok';
            }
            if (btn) btn.disabled = false;
        }

        // The period only makes sense while the switch is on.
        function updateAutosavePeriodVisibility() {
            const box = document.getElementById('dns-internal-autosave');
            const row = document.getElementById('dns-internal-autosave-period-row');
            if (row) row.style.display = (box && box.checked) ? '' : 'none';
            if (box && box.checked) applyAutosaveIntervalMax();
        }
        let persistPollTimer = null;

        async function updateInternalCacheFileStatus() {
            const el = document.getElementById('dns-internal-file-status');
            if (!el) return;
            try {
                const d = await fetchJSON('/api/dns/internal-cache/file');
                if (d.exists) {
                    const kb = (d.size_bytes / 1024).toFixed(1);
                    el.textContent = tr('dns_internal.file_exists') + ' ' +
                                     kb + ' KB, ' + tr('dns_internal.file_entries') + ' ' +
                                     d.entries;
                    el.className = 'test-conn-result test-conn-ok';
                } else {
                    el.textContent = tr('dns_internal.file_missing');
                    el.className = 'test-conn-result test-conn-warn';
                }
            } catch (e) {
                el.textContent = tr('dns_internal.file_missing');
                el.className = 'test-conn-result test-conn-warn';
            }
        }

        function setPersistBusy(busy, save) {
            const row = document.getElementById('dns-internal-progress-row');
            const label = document.getElementById('dns-internal-progress-label');
            if (!row || !label) return;
            if (busy) {
                label.textContent = save ? tr('dns_internal.saving') : tr('dns_internal.loading');
                row.style.display = 'block';
            } else {
                row.style.display = 'none';
            }
        }

        function renderPersistProgress(p) {
            const bar = document.getElementById('dns-internal-progress-bar');
            const pct = document.getElementById('dns-internal-progress-percent');
            const done = document.getElementById('dns-internal-progress-done');
            if (!bar || !pct || !done) return;
            const percent = Math.max(0, Math.min(100, p.percent || 0));
            bar.style.width = percent + '%';
            pct.textContent = percent + '%';
            done.textContent = tr('dns_internal.file_entries') + ': ' + p.done +
                               ' / ' + (p.total > 0 ? p.total : '?');
        }

        // Poll GET .../progress every 0.5 s until the background job finishes,
        // then refresh the file status and re-enable the buttons.
        function pollPersistProgress(save) {
            if (persistPollTimer) clearInterval(persistPollTimer);
            persistPollTimer = setInterval(async () => {
                let p = { busy: true };
                try { p = await fetchJSON('/api/dns/internal-cache/progress'); } catch (e) { /* keep busy */ }
                if (p.busy) {
                    renderPersistProgress(p);
                    return;
                }
                clearInterval(persistPollTimer);
                persistPollTimer = null;
                setPersistBusy(false);
                renderPersistProgress(p);
                enablePersistButtons(true);
                const out = document.getElementById('dns-internal-file-status');
                if (out && p.total > 0) {
                    out.textContent = (p.save ? tr('dns_internal.saved') : tr('dns_internal.loaded')) +
                                      ' ' + p.done + ' ' + tr('dns_internal.file_entries');
                    out.className = 'test-conn-result test-conn-ok';
                }
                // Refresh the cache-file line in the background (after the
                // "Saved/Loaded N" message so it does not overwrite it).
                setTimeout(updateInternalCacheFileStatus, 300);
            }, 500);
        }

        function enablePersistButtons(enabled) {
            document.querySelectorAll('#dns-internal-persist button').forEach(b => {
                b.disabled = !enabled;
            });
        }

        async function startPersistJob(save, btn, force) {
            const out = document.getElementById('dns-internal-file-status');
            enablePersistButtons(false);
            out.textContent = save ? tr('dns_internal.saving') : tr('dns_internal.loading');
            out.className = 'test-conn-result test-conn-warn';
            try {
                const resp = await apiFetch(
                    save ? '/api/dns/internal-cache/save' : '/api/dns/internal-cache/load',
                    {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ force: !!force }),
                    });
                const d = await resp.json();

                // The device refuses a cache file it did not write (the checksum
                // it keeps in NVS does not match the file on the card). That is
                // not an error to swallow: the operator decides whether the file
                // is worth loading anyway, and the question is asked in the page
                // (js/app.js `showDialog`) rather than by the browser — that one
                // cannot be styled, translated or screenshotted.
                if (!save && !force && resp.status === 409 && d.code === 'md5_mismatch') {
                    const why = (d.reason === 'unknown')
                        ? tr('dns_internal.md5_unknown')
                        : (d.reason === 'mismatch')
                            ? tr('dns_internal.md5_mismatch')
                            : tr('dns_internal.md5_unreadable');
                    const answer = await showDialog({
                        title: tr('dns_internal.md5_ask'),
                        hint: why + '\n\n' +
                              tr('dns_internal.md5_file') + ': ' + (d.file_md5 || '—') + '\n' +
                              tr('dns_internal.md5_stored') + ': ' + (d.stored_md5 || '—'),
                        okLabel: tr('dns_internal.md5_load_anyway'),
                        cancelLabel: tr('common.cancel'),
                        danger: true,
                    });
                    if (answer) {
                        return await startPersistJob(save, btn, true);
                    }
                    out.textContent = tr('dns_internal.md5_cancelled');
                    out.className = 'test-conn-result test-conn-warn';
                    enablePersistButtons(true);
                    return;
                }

                if (resp.ok && d.status === 'started') {
                    setPersistBusy(true, save);
                    pollPersistProgress(save);
                } else {
                    out.textContent = (d.message || tr('dns_internal.load_failed'));
                    out.className = 'test-conn-result test-conn-fail';
                    enablePersistButtons(true);
                }
            } catch (e) {
                out.textContent = tr('dns_internal.load_failed');
                out.className = 'test-conn-result test-conn-fail';
                enablePersistButtons(true);
            }
        }

        async function saveInternalCacheFile(btn) {
            await startPersistJob(true, btn);
        }

        async function loadInternalCacheFile(btn) {
            await startPersistJob(false, btn);
        }

        // Drop every entry held in PSRAM. The file on the card is left alone:
        // this is the button for a cache full of answers the operator does not
        // trust any more, not a request to lose what was persisted (the next
        // save overwrites that file anyway). The question is asked in the page
        // (js/app.js showDialog), not by the browser.
        async function resetInternalCache(btn) {
            const answer = await showDialog({
                title: tr('dns_internal.reset_ask'),
                hint: tr('dns_internal.reset_hint'),
                okLabel: tr('dns_internal.reset'),
                cancelLabel: tr('common.cancel'),
                danger: true,
            });
            if (!answer) return;

            const out = document.getElementById('dns-internal-file-status');
            enablePersistButtons(false);
            out.textContent = tr('dns_internal.resetting');
            out.className = 'test-conn-result test-conn-warn';
            try {
                const resp = await apiFetch('/api/dns/internal-cache/reset', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({}),
                });
                const d = await resp.json();
                const ok = resp.ok && d.status === 'ok';
                out.textContent = ok ? tr('dns_internal.reset_done')
                                     : tr('dns_internal.reset_failed');
                out.className = ok ? 'test-conn-result test-conn-ok'
                                   : 'test-conn-result test-conn-fail';
                updateInternalCacheFileStatus();
            } catch (e) {
                out.textContent = tr('dns_internal.reset_failed');
                out.className = 'test-conn-result test-conn-fail';
            }
            enablePersistButtons(true);
        }

        loadInternalCacheSettings();

        // The file status is dynamic (tr() text) — only render it once the
        // translation dictionary has been fetched (loadTranslations is async).
        function refreshFileStatusWhenReady() {
            if (!translations || Object.keys(translations).length === 0) {
                setTimeout(refreshFileStatusWhenReady, 50);
                return;
            }
            updateInternalCacheFileStatus();
        }
        document.addEventListener('DOMContentLoaded', refreshFileStatusWhenReady);
    </script>
</body>
</html>
