<!DOCTYPE html>
<html lang="ru" data-page="version">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Version — DHCPServer</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div id="header-placeholder"></div>

    <main class="container">
        <h1 data-i18n="version.title">Firmware Version</h1>

        <div class="card">
            <p><strong data-i18n="version.label">Version:</strong> <span id="fw-version">--</span></p>
        </div>

        <div class="card">
            <h2 data-i18n="update.title">Firmware Update</h2>
            <label data-i18n="update.select">Select .bin file</label>
            <input type="file" id="fw-file" accept=".bin">

            <!-- Starts disabled: there is nothing to upload until a file is
                 chosen, and the script below keeps this state up to date. -->
            <button class="btn btn-primary" onclick="uploadFirmware()" id="fw-upload-btn" data-i18n="update.upload" disabled>Upload</button>
            <div id="fw-status" style="margin-top:1rem;"></div>
        </div>

        <div class="card">
            <h2 data-i18n="webupdate.title">Web Interface Update</h2>
            <label data-i18n="webupdate.select">Select the "data" folder</label>
            <input type="file" id="webui-folder" webkitdirectory multiple hidden>
            <button type="button" class="btn btn-primary" id="webui-browse-btn" data-i18n="webupdate.browse">Choose folder</button>
            <span id="webui-folder-name" class="hint" data-i18n="webupdate.no_folder">No folder selected</span>
            <p class="hint" data-i18n="webupdate.note">Existing files are overwritten. New pages are only reachable after a firmware update that registers a route for them.</p>

            <!-- Starts disabled as well: the folder picker below is the only
                 thing that can fill the upload queue. -->
            <button class="btn btn-primary" onclick="uploadWebUi()" id="webui-upload-btn" data-i18n="webupdate.upload" disabled>Upload</button>
            <div id="webui-status" style="margin-top:1rem;"></div>
        </div>
    </main>

    <div id="footer-placeholder"></div>
    <script src="../js/app.js"></script>
    <script>
        async function loadVersion() {
            const data = await fetchJSON('/api/version');
            document.getElementById('fw-version').textContent = data.firmware_version || '--';
        }

        // ── Firmware Update ──
        // The Upload button follows the file input: enabled only while an image
        // is selected. The card has a single action, so a button that can only
        // answer "please select a file" is a dead end for the operator.
        const fwInput = document.getElementById('fw-file');
        const fwBtn = document.getElementById('fw-upload-btn');

        function refreshFwUploadState() {
            fwBtn.disabled = !(fwInput.files && fwInput.files.length > 0);
        }

        // One status line per card, and every operation starts from a blank one:
        // a message on screen must always belong to the last thing the operator
        // did, never to the attempt before it. The firmware card therefore
        // clears the line when the picker is opened, when a file is chosen and
        // when an upload starts.
        //
        // Success is transient (see kSuccessClearMs): it has been read by the
        // time the next action starts, and it used to sit under the button
        // until the page was reloaded. A failure stays on screen — it carries
        // the reason — and every new message cancels the pending timeout, so a
        // stale timer can never blank a line that belongs to a newer operation.
        const kSuccessClearMs = 5000;
        let fwStatusTimer = null;

        function fwStatus(html, transient) {
            const el = document.getElementById('fw-status');
            if (fwStatusTimer !== null) {
                clearTimeout(fwStatusTimer);
                fwStatusTimer = null;
            }
            el.innerHTML = html;
            if (transient) {
                fwStatusTimer = setTimeout(() => {
                    el.innerHTML = '';
                    fwStatusTimer = null;
                }, kSuccessClearMs);
            }
        }

        fwInput.addEventListener('click', () => fwStatus(''));
        fwInput.addEventListener('change', () => {
            fwStatus('');                    // the old result no longer applies
            refreshFwUploadState();
        });
        refreshFwUploadState();   // the markup already starts out disabled

        async function uploadFirmware() {
            const file = fwInput.files[0];
            if (!file) return;   // not reachable while the button is disabled

            const btn = fwBtn;

            // Before the image is sent, the device writes what the "before
            // reboot" switches ask for — and the operator gets to see it, and to
            // say no when the cache could not be written. The flow is the same
            // one the Reboot button runs (js/app.js); `saved=1` then tells the
            // device there is nothing left for it to write before it restarts.
            const stepLine = (text, cls) => {
                fwStatus(`<p class="${cls || ''}"></p>`);
                document.querySelector('#fw-status p').textContent = text;
            };
            // `'update'`: the question this flow may ask is about an *update*, not
            // about a reboot — the device restarts after the image is installed, but
            // what the operator is doing here is updating firmware.
            const prepared = await prepareRestartFlow(stepLine, 'update');
            if (prepared === 'cancelled') {
                // The flow has already said what happened, and nothing was sent.
                refreshFwUploadState();
                return;
            }

            btn.disabled = true;
            btn.textContent = translations?.update?.uploading || 'Uploading...';

            // Send the image as the raw request body — deliberately NOT as
            // multipart/form-data. The OTA endpoint writes the bytes it receives
            // straight into the flash partition, so with multipart the part
            // headers land inside the image, the first byte is not the 0xE9
            // signature, and esp_ota_end() rejects it ("OTA update failed").
            // A raw body is accepted by both the old and the new firmware (the
            // new one also tolerates multipart, for curl --data-binary scripts),
            // which is what lets a device stuck on an older build update again.
            try {
                const url = '/api/ota/upload' + (prepared === 'ready' ? '?saved=1' : '');
                const resp = await apiFetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/octet-stream' },
                    body: file,
                });
                // The answer must be checked: a failed update (bad image, no
                // space, aborted transfer) comes back as 500 + {"status":"error"}
                // and the device does NOT reboot. Reporting success regardless
                // is what made an earlier failed OTA look like it worked.
                let result = null;
                try { result = await resp.json(); } catch (e) { /* non-JSON */ }

                if (resp.ok && result && result.status === 'ok') {
                    // The device reboots on success, so this line usually only
                    // lives until the page reloads — the timer also covers the
                    // case where the reboot does not happen as expected.
                    fwStatus(`<p class="status-ok">${translations?.update?.success || 'Update successful! Rebooting...'}</p>`, true);
                } else {
                    let msg = (result && result.message) || ('HTTP ' + resp.status);
                    if (result && result.detail) msg += ' (' + result.detail + ')';
                    fwStatus(`<p class="status-err">${translations?.update?.failed || 'Update failed'}: ${msg}</p>`);
                }
            } catch (e) {
                fwStatus(`<p class="status-err">Error: ${e.message}</p>`);
            } finally {
                btn.textContent = translations?.update?.upload || 'Upload';
                refreshFwUploadState();   // a file is still selected → stays enabled
            }
        }

        // ── Web Interface Update (folder picker) ──
        // The native <input type="file"> button text ("Choose files / No file
        // chosen") is drawn by the browser and cannot be translated, so we
        // hide it and use our own button + status label instead.
        const webuiInput = document.getElementById('webui-folder');
        const webuiBrowseBtn = document.getElementById('webui-browse-btn');
        const webuiName = document.getElementById('webui-folder-name');
        const webuiUploadBtn = document.getElementById('webui-upload-btn');

        // The success line is transient: the operator has read it by the time
        // the next action starts, and it would otherwise sit under the button
        // until the page is reloaded. A failure stays on screen — it lists the
        // files to retry. The timer is cleared on every new message, so a late
        // timeout can never blank the progress of a running upload.
        let webuiStatusTimer = null;

        function webuiStatus(html, transient) {
            const el = document.getElementById('webui-status');
            if (webuiStatusTimer !== null) {
                clearTimeout(webuiStatusTimer);
                webuiStatusTimer = null;
            }
            el.innerHTML = html;
            if (transient) {
                webuiStatusTimer = setTimeout(() => {
                    el.innerHTML = '';
                    webuiStatusTimer = null;
                }, kSuccessClearMs);
            }
        }

        // Same rule as the firmware Upload button: with nothing selected there
        // is nothing to send (one request per file), so the button is disabled
        // instead of being clickable and answering with an alert.
        function refreshWebUiUploadState() {
            webuiUploadBtn.disabled =
                !(webuiInput.files && webuiInput.files.length > 0);
        }

        refreshWebUiUploadState();   // the markup already starts out disabled

        // The chosen folder, kept so the line can be written again on a language
        // switch: the label is built at runtime and therefore carries no
        // `data-i18n` (applyTranslations() would overwrite it), and the shared
        // `i18n-applied` event is the hook for exactly that case.
        let webuiPick = null;

        function renderWebUiPick() {
            if (!webuiPick) return;
            // "файлов: 26 · папка: data" — labels and numbers, not a sentence:
            // a counted noun would need plural forms in both languages, and this
            // line says the same thing without them. What it must name is the
            // **folder** and how much is in it, never the first entry: the picker
            // reports its files in its own order, so naming one of them made the
            // page look like it was about that one file. The folder is the first
            // segment of any relative path (`data/pages/x.html` → `data`).
            webuiName.removeAttribute('data-i18n');
            webuiName.textContent =
                (translations?.webupdate?.file_count || 'files') + ': ' +
                webuiPick.count + ' · ' +
                (translations?.webupdate?.folder || 'folder') + ': ' +
                webuiPick.folder;
        }

        document.addEventListener('i18n-applied', renderWebUiPick);

        webuiBrowseBtn.addEventListener('click', () => {
            webuiStatus('');   // same rule: opening the picker clears the last result
            webuiInput.click();
        });
        webuiInput.addEventListener('change', () => {
            webuiStatus('');   // the old result no longer applies
            refreshWebUiUploadState();
            const files = Array.from(webuiInput.files || []);
            if (files.length) {
                const first = files[0].webkitRelativePath || files[0].name;
                webuiPick = {
                    count: files.length,
                    folder: first.indexOf('/') >= 0 ? first.split('/')[0] : '.',
                };
                renderWebUiPick();
            } else {
                webuiPick = null;
                webuiName.setAttribute('data-i18n', 'webupdate.no_folder');
                applyTranslations();
            }
        });

        async function uploadWebUi() {
            const files = Array.from(webuiInput.files || []);
            if (!files.length) return;   // not reachable while the button is disabled

            const btn = webuiUploadBtn;
            const status = document.getElementById('webui-status');

            // Overwriting the web interface deserves a question, and it is asked
            // in the page (js/app.js `showDialog`) rather than by the browser:
            // the native dialog cannot be translated or styled and is blocked in
            // some embedded browsers. The label line is the same one the picker
            // shows, so what is confirmed is what was chosen.
            const answer = await showDialog({
                title: tr('webupdate.confirm_title'),
                hint: tr('webupdate.file_count') + ': ' + (webuiPick ? webuiPick.count : files.length) +
                      ' · ' + tr('webupdate.folder') + ': ' + (webuiPick ? webuiPick.folder : '.') +
                      '\n\n' + tr('webupdate.note'),
                okLabel: tr('webupdate.upload'),
                cancelLabel: tr('common.cancel'),
            });
            if (!answer) return;

            btn.disabled = true;
            webuiStatus('');   // the run that starts now owns the line (and cancels a pending clear)

            let okCount = 0;
            let failCount = 0;
            const failed = [];

            // Strip the first path segment (the picked folder name) from
            // webkitRelativePath ("data/pages/x.html" -> "pages/x.html").
            const relPath = f =>
                (f.webkitRelativePath || f.name).replace(/^[^/]*\//, '');

            btn.textContent = translations?.webupdate?.uploading || 'Uploading...';

            try {
                for (const file of files) {
                    const path = relPath(file);
                    try {
                        const resp = await apiFetch('/api/web/file?path=' + encodeURIComponent(path), {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/octet-stream' },
                            body: file, // raw file bytes
                        });
                        if (resp.ok) {
                            okCount++;
                        } else {
                            failCount++;
                            failed.push(path);
                        }
                    } catch (e) {
                        failCount++;
                        failed.push(path);
                    }
                    status.innerHTML =
                        `<p class="status-stopped">${okCount + failCount}/${files.length} ` +
                        `${translations?.webupdate?.progress || 'files'}</p>`;
                }
            } finally {
                btn.textContent = translations?.webupdate?.upload || 'Upload';
                refreshWebUiUploadState();   // the folder is still selected → stays enabled
            }

            let html = '';
            if (failCount === 0) {
                html += `<p class="status-ok">${translations?.webupdate?.success || 'All files uploaded successfully.'}</p>`;
            } else {
                html += `<p class="status-err">${failCount} ${translations?.webupdate?.failed || 'files failed:'} ${failed.join(', ')}</p>`;
            }
            webuiStatus(html, failCount === 0);
        }

        // Load version on page load
        loadVersion();
    </script>
</body>
</html>
