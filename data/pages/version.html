<!DOCTYPE html>
<html lang="ru" data-page="version">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Version — DHCPServer</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div id="header-placeholder"></div>

    <main class="container">
        <h1 data-i18n="version.title">Firmware Version</h1>

        <div class="card">
            <p><strong data-i18n="version.label">Version:</strong> <span id="fw-version">--</span></p>
        </div>

        <div class="card">
            <h2 data-i18n="update.title">Firmware Update</h2>
            <label data-i18n="update.select">Select .bin file</label>
            <input type="file" id="fw-file" accept=".bin">

            <button class="btn btn-primary" onclick="uploadFirmware()" id="fw-upload-btn" data-i18n="update.upload">Upload</button>
            <div id="fw-status" style="margin-top:1rem;"></div>
        </div>
    </main>

    <div id="footer-placeholder"></div>
    <script src="../js/app.js"></script>
    <script>
        async function loadVersion() {
            const data = await fetchJSON('/api/version');
            document.getElementById('fw-version').textContent = data.firmware_version || '--';
        }

        async function uploadFirmware() {
            const fileInput = document.getElementById('fw-file');
            const file = fileInput.files[0];
            if (!file) return alert('Please select a file');

            const btn = document.getElementById('fw-upload-btn');
            btn.disabled = true;
            btn.textContent = translations?.update?.uploading || 'Uploading...';

            const formData = new FormData();
            formData.append('firmware', file);

            try {
                const resp = await apiFetch('/api/ota/upload', {
                    method: 'POST',
                    body: formData,
                });
                const result = await resp.json();
                document.getElementById('fw-status').innerHTML =
                    `<p class="status-ok">${translations?.update?.success || 'Update successful! Rebooting...'}</p>`;
            } catch (e) {
                document.getElementById('fw-status').innerHTML =
                    `<p class="status-err">Error: ${e.message}</p>`;
            } finally {
                btn.disabled = false;
                btn.textContent = translations?.update?.upload || 'Upload';
            }
        }

        // Load version on page load
        loadVersion();
    </script>
</body>
</html>
