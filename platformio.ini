[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32 @ >=6.0.0
board = esp32dev
framework = espidf
extra_scripts =
    scripts/upload_spiffs.py
    scripts/fs_image.py
board_build.flash_mode = dio
board_build.f_cpu = 240000000L
board_build.f_flash = 40000000L

# Custom partition table
board_build.partitions = partitions/dhcp_partitions.csv

# Firmware version configuration (menuconfig defaults)
board_build.menuconfig.FW_VER_GLOBAL = 1
board_build.menuconfig.FW_VER_DEVICE = 2
board_build.menuconfig.FW_VER_RELEASE = 36
board_build.menuconfig.FW_VER_SUBRELEASE = 0
board_build.menuconfig.FW_VER_YEAR = 26
board_build.menuconfig.FW_VER_MONTH = 9
board_build.menuconfig.FW_VER_REGION = "RU"

# Ethernet (ENC28J60)
board_build.menuconfig.ETH_ENABLED = 1
board_build.menuconfig.ETH_USE_SPI_ETHERNET = 1
board_build.menuconfig.ETH_SPI_ETHERNET_ENC28J60 = 1

# Monitor settings
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

# ─── ESP-Prog Debug Configuration ───────────────────
#
# ESP-Prog JTAG connections to ESP32-WROOM-32:
#   ESP-Prog       →  ESP32
#   TDI (pin 5)    →  GPIO12 (TDI)
#   TDO (pin 13)   →  GPIO15 (TDO)
#   TCK (pin 9)    →  GPIO13 (TCK)
#   TMS (pin 7)    →  GPIO14 (TMS)
#   GND            →  GND
#   VCC (3.3V)     →  3.3V
#
# Additionally, connect:
#   ESP-Prog GPIO0 →  ESP32 GPIO0  (for flash mode control)
#   ESP-Prog EN    →  ESP32 EN     (for reset control)
#
# FTDI drivers required: https://ftdichip.com/drivers/vcp-drivers/
# OpenOCD is bundled with PlatformIO.

[env:esp32dev-debug]
platform = espressif32 @ >=6.0.0
board = esp32dev
framework = espidf
extra_scripts =
    scripts/upload_spiffs.py
    scripts/fs_image.py
board_build.flash_mode = dio
board_build.f_cpu = 240000000L
board_build.f_flash = 40000000L
board_build.partitions = partitions/dhcp_partitions.csv

# ESP-Prog configuration
debug_tool = esp-prog
upload_protocol = esp-prog
debug_init_break = tbreak app_main
debug_speed = 20000

# Ethernet (ENC28J60)
board_build.menuconfig.ETH_ENABLED = 1
board_build.menuconfig.ETH_USE_SPI_ETHERNET = 1
board_build.menuconfig.ETH_SPI_ETHERNET_ENC28J60 = 1

# Firmware version (same as main env)
board_build.menuconfig.FW_VER_GLOBAL = 1
board_build.menuconfig.FW_VER_DEVICE = 2
board_build.menuconfig.FW_VER_RELEASE = 36
board_build.menuconfig.FW_VER_SUBRELEASE = 0
board_build.menuconfig.FW_VER_YEAR = 26
board_build.menuconfig.FW_VER_MONTH = 9
board_build.menuconfig.FW_VER_REGION = "RU"

# Monitor settings
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
